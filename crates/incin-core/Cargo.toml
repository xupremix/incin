[package]
description = "Core tensor operations and static shape checking for incin"
repository = "https://github.com/xupremix/incin"
authors = ["xupremix <xupremix.me@gmail.com>"]
name = "incin-core"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Standard-library serialization, model I/O, and error integrations.
default = ["std"]
std = [
    "thiserror/std",
    "half/std",
    "anyhow/std",
    "serde/std",
    "prost/std",
    "bytes/std",
    "safetensors",
    "serde_json",
    "postcard",
]
# Enables nightly-only experiments. Empty on stable builds by design.
nightly = []
# Recomputes a descriptor's own invariants inside executors (EXE-002). A debug
# and test aid only: the contract is that a `Validated<O>` was already checked
# by the lowering rule that minted it, so a release build must never need this.
paranoid-validation = []
# Typed logical meshes, physical binding, placement proofs, and placement-aware
# tensors (DST-001 through DST-004). Preview-tier and therefore not default; it
# adds no dependency, and reads no hardware outside `DeviceMesh::bind` through
# a `TopologyProbe` this crate never implements.
distributed = []
# Enables CUDA device marker metadata used by CUDA-capable backend crates.
cuda = []
# Enables WGPU device marker metadata used by WGPU-capable backend crates.
wgpu = []
# Enables Metal device marker metadata used by Metal-capable backend crates.
metal = []
# Feature-gated test utilities and mock/dummy backends.
test-utils = []


# candle = ["dep:candle-core", "dep:candle-nn"]
# cuda = ["dep:candle-core?/cuda", "dep:candle-nn?/cuda"]

[dependencies]
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex", "lazy"] }
incin-macros = { path = "../incin-macros", version = "0.0.0", default-features = false }
thiserror = { workspace = true, default-features = false }
half = { workspace = true, default-features = false }
bytemuck = { workspace = true, default-features = false }
anyhow = { version = "1.0.103", default-features = false }
typenum = { version = "1.20.1", default-features = false }
safetensors = { version = "0.4.1", optional = true } # safetensors requires std
serde_json = { version = "1.0.120", optional = true }
postcard = { version = "1.1.3", optional = true, features = ["alloc", "use-std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
bytes = { version = "1.12.0", default-features = false }
ggml-quants = "0.1.0"
hashbrown = { version = "0.14", default-features = false, features = ["alloc", "inline-more", "ahash", "serde"] }


[dev-dependencies]
trybuild = "1.0.117"
serde_json = "1.0.120"
tempfile = "3.27"
incin-backends = { path = "../incin-backends", default-features = false, features = ["std", "cpu", "wgpu"] }

[build-dependencies]
prost-build = "0.14.4"
# miette = { workspace = true }
