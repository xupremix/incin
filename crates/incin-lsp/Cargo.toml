[package]
repository = "https://github.com/xupremix/incin"
publish = false
authors = ["xupremix <xupremix.me@gmail.com>"]
name = "incin-lsp"
description = "Transparent LSP proxy that rewrites typenum shape diagnostics and inlay hints between an editor and rust-analyzer."
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
incin-diagnostics = { path = "../incin-diagnostics", version = "0.0.0" }
serde_json = "1.0.120"

[[bin]]
name = "incin-lsp"
path = "src/main.rs"

[[bin]]
name = "mock-rust-analyzer"
path = "src/bin/mock_rust_analyzer.rs"
test = false
doc = false

[lints]
workspace = true
