[package]
description = "Procedural macros and static dimension verification for incin"
repository = "https://github.com/xupremix/incin"
authors = ["xupremix <xupremix.me@gmail.com>"]
name = "incin-macros"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[features]
# Procedural macros use the standard library by default.
default = ["std"]
# Standard-library support for compile-time model and file processing.
std = []
# Enables nightly-only macro experiments. Empty on stable by design.
nightly = []
# Enables distributed macro tests and integrations.
distributed = ["incin/distributed"]



[dependencies]
proc-macro2 = { workspace = true}
syn = { workspace = true }
quote = { workspace = true }
safetensors = "0.4.5"
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
onnx-pb = "0.1.4"
prost = "0.6"

[dev-dependencies]
incin = { path = "../incin", features = ["distributed"] }
incin-core = { path = "../incin-core", features = ["distributed"] }
trybuild = "1.0.117"



