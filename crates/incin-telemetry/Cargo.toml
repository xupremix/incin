[package]
description = "Observability and run telemetry for incin"
repository = "https://github.com/xupremix/incin"
publish = true
name = "incin-telemetry"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
interprocess = "2.4.2"
incin-core = { path = "../incin-core", version = "0.0.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.120"
thiserror.workspace = true
uuid = { version = "1.23.4", features = ["v7"] }

[lints]
workspace = true
