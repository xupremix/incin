[package]
name = "kindle-viz"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[[bin]]
name = "kindle-viz"
path = "src/main.rs"

[lib]
name = "kindle_viz"
path = "src/lib.rs"

[dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
kindle-telemetry = { path = "../kindle-telemetry" }
kindle-viz-plugin-api = { path = "../kindle-viz-plugin-api" }
serde_json = "1.0.120"
anyhow = "1.0.103"
thiserror.workspace = true

[dev-dependencies]
uuid = { version = "1.23.4", features = ["v7"] }

[lints]
workspace = true
