[package]
description = "Compute backends (CPU, WGPU, CUDA) for incin"
repository = "https://github.com/xupremix/incin"
name = "incin-backends"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[features]
# A bare dependency is a standard-library CPU build. GPU and external
# integrations are always explicit opt-ins.
default = ["std", "cpu"]
# Enables APIs that require the Rust standard library.
std = [
    "incin-core/std",
    "anyhow/std",
    "rand/std",
    "rand/std_rng",
    "rand_distr/std",
    "half/std"
]
# Enables Incin's built-in pure-Rust CPU backend.
cpu = []
# Enables Incin's native CUDA backend through cudarc.
cuda = ["std", "dep:cudarc", "incin-core/cuda"]
# Enables Incin's cross-platform GPU backend through wgpu.
wgpu = ["std", "dep:wgpu", "dep:pollster", "incin-core/wgpu"]
# Benchmarks legal CUDA launch configurations and caches the selected candidate.
autotune = ["cuda"]
# Enables the external Candle backend at `incin_backends::external::candle`.
external-candle = ["std", "dep:candle-core", "dep:candle-nn"]
# Deprecated alias for `external-candle`. Removed at REL-002; see PROPOSALS.md D-014.
candle = ["external-candle"]
# Connects backend execution and autograd events to `incin-telemetry`.
telemetry = ["std", "dep:incin-telemetry"]

[dependencies]
incin-core = { path = "../incin-core", default-features = false, version = "0.0.0" }
anyhow = { version = "1.0.103", default-features = false }
spin = { version = "0.9.8", default-features = false, features = ["rwlock", "mutex", "spin_mutex"] }
rand = { version = "0.8", default-features = false, features = ["alloc", "small_rng"] }
rand_distr = { version = "0.4", default-features = false, features = ["alloc"] }
half = { workspace = true, default-features = false }
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
ggml-quants = "0.1.0"
incin-telemetry = { path = "../incin-telemetry", version = "0.0.0", optional = true }
hashbrown = { version = "0.14", default-features = false, features = ["alloc", "inline-more", "ahash"] }
rayon = "1.10.0"
log = "0.4.22"

# WGPU Backend
wgpu = { version = "22.0.0", optional = true }
pollster = { version = "0.3.0", optional = true }

# CUDA Backend
cudarc = { version = "0.19.8", optional = true, features = ["cuda-12000", "nvrtc", "cublas", "cudnn", "f16"] }

# External backend integration
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }

[lints]
workspace = true
