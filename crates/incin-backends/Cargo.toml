[package]
authors.workspace = true
description = "Compute backends (CPU, WGPU, CUDA) for incin"
repository.workspace = true
name = "incin-backends"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["machine-learning", "tensor", "gpu", "wgpu", "cuda"]
categories = ["science", "hardware-support"]
documentation = "https://docs.rs/incin-backends"

[features]
# A bare dependency is a standard-library CPU build. GPU and external
# integrations are always explicit opt-ins.
default = ["std", "cpu"]
# Enables APIs that require the Rust standard library.
std = [
    "incin-core/std",
    "anyhow/std",
    "rand/std",
    "rand/std_rng",
    "rand/thread_rng",
    "rand_distr/std",
    "half/std"
]
# Enables Incin's built-in pure-Rust CPU backend. Declares `std` for the same
# reason `cuda` and `wgpu` do: the kernels reach for `Vec` and `Box` through the
# std prelude and the autograd tape is a `thread_local!`, so `cpu` without `std`
# was a combination the manifest offered and the crate never compiled under.
cpu = ["std"]
# Enables execution of compiled graphs through the canonical CPU descriptors.
compiled = ["std", "cpu", "incin-core/compiled"]
# Hands large f32 CPU matmuls to a blocked, register-tiled GEMM. Off by
# default: the pure-Rust kernels in cpu/ops/matmul.rs stay complete without
# it, and enabling it changes only floating-point accumulation order.
cpu-blas = ["std", "cpu", "dep:matrixmultiply"]
# Enables Incin's native CUDA backend through cudarc.
cuda = ["std", "dep:cudarc", "incin-core/cuda"]
# Gates cuBLAS / cuDNN vendor library call sites.
cuda-vendor = ["cuda"]
# Enables Incin's cross-platform GPU backend through wgpu.
wgpu = ["std", "dep:wgpu", "dep:pollster", "incin-core/wgpu"]
# Enables Incin's native Metal backend for Apple Silicon.
metal = ["std", "incin-core/metal"]
# Enables MPS and MPSGraph structured primitives for Apple Silicon.
metal-mps = ["metal"]


# Benchmarks legal CUDA launch configurations and caches the selected candidate.
autotune = ["cuda"]
# Enables the external Candle backend at `incin_backends::external::candle`.
external-candle = ["std", "dep:candle-core", "dep:candle-nn"]
# Connects backend execution and autograd events to `incin-telemetry`.
telemetry = ["std", "dep:incin-telemetry"]
# Shared distributed contracts and topology types. Transport implementations
# remain opt-in so the normal CPU build does not gain communication machinery.
distributed = ["std", "incin-core/distributed"]
# Deterministic in-process CPU reference collectives used for conformance,
# adjoint, and planner tests.
distributed-reference = ["distributed"]
# Real process-per-rank CUDA collectives. cudarc loads NCCL at runtime.
distributed-nccl = ["distributed", "cuda", "autotune", "cudarc/nccl"]
# Deterministic fault-injection hooks used only by integration tests. This is
# deliberately opt-in and is never part of a product build.
test-utils = []

[dependencies]
incin-core = { path = "../incin-core", default-features = false, version = "0.1.0" }
# `const-generics` supplies typenum's `Const<N>`/`ToUInt`/`U<N>` bridge, which
# is how `target.rs` turns a Rust array length into the type-level dimension a
# static shape needs. The feature only adds items, so enabling it here cannot
# affect anything else in the graph.
typenum = { version = "1.20.1", default-features = false, features = ["const-generics"] }
anyhow = { version = "1.0.103", default-features = false }
spin = { version = "0.12.2", default-features = false, features = ["rwlock", "mutex", "spin_mutex"] }
# `small_rng` stopped being a feature in rand 0.10; `SmallRng` is
# unconditional now, which is what the no-std creation path uses.
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_distr = { version = "0.6", default-features = false, features = ["alloc"] }
half = { workspace = true, default-features = false }
thiserror = { workspace = true, default-features = false }
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
ggml-quants = "0.1.0"
incin-telemetry = { path = "../incin-telemetry", version = "0.1.0", optional = true }
hashbrown = { version = "0.17", default-features = false, features = ["alloc", "inline-more", "default-hasher"] }
rayon = "1.10.0"
matrixmultiply = { version = "0.3.11", optional = true }
log = "0.4.22"
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.120"

# WGPU Backend
wgpu = { version = "22.0.0", optional = true }
pollster = { version = "1.0.1", optional = true }

# CUDA Backend
cudarc = { version = "0.19.8", optional = true, features = ["cuda-12000", "nvrtc", "cublas", "cudnn", "f16"] }

# External backend integration
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }

[dev-dependencies]
trybuild = "1.0.117"
tempfile = "3.27"

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds the default feature set unless told otherwise, which would
# document a fraction of this crate. Hardware-only features are deliberately
# absent: docs.rs has no GPU and a build that cannot link is worse than a
# page that says the feature exists.
features = ["std", "cpu", "compiled", "telemetry", "distributed"]
rustdoc-args = ["--cfg", "docsrs"]
