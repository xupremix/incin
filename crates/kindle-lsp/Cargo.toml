[package]
publish = false
authors = ["xupremix <xupremix.me@gmail.com>"]
name = "kindle-lsp"
description = "Transparent LSP proxy that rewrites typenum shape diagnostics and inlay hints between an editor and rust-analyzer."
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[dependencies]
kindle-diagnostics = { path = "../kindle-diagnostics" }
serde_json = "1.0.120"

[[bin]]
name = "kindle-lsp"
path = "src/main.rs"

[[bin]]
name = "mock-rust-analyzer"
path = "src/bin/mock_rust_analyzer.rs"
test = false
doc = false

[lints]
workspace = true
