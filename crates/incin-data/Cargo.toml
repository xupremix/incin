[package]
authors.workspace = true
description = "Dataset loading and streaming utilities for incin"
repository.workspace = true
name = "incin-data"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["machine-learning", "dataset", "dataloader", "mnist", "incin"]
categories = ["science"]
documentation = "https://docs.rs/incin-data"

[features]
# Dataset iteration, collation, and transforms — everything that does not reach
# the network. The default adds `download` because the bundled vision datasets
# fetch their own archives; nothing here pulls an async runtime.
default = ["download"]
# HTTP download and gzip extraction, used by the bundled dataset fetchers.
download = ["dep:ureq", "dep:flate2"]
# The Hugging Face Hub client. Not a default: it brings an async runtime and a
# second TLS stack into the dependency graph of every crate that depends on the
# facade, for an API most training code never calls.
hub = ["dep:hf-hub"]

[package.metadata.incin.feature-contract]
download = { tier = "stable", owner = "data", prerequisites = [], hardware = "network" }
hub = { tier = "stable", owner = "data", prerequisites = [], hardware = "network" }

[dependencies]
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "rustls-tls", "ureq"], optional = true }
incin-core = { version = "0.1.0-rc.2", path = "../incin-core" }
thiserror = { workspace = true }
rand = "0.10"
ureq = { version = "3.3.0", optional = true }
flate2 = { version = "1.1.9", optional = true }

[dev-dependencies]
incin-backends = { path = "../incin-backends", default-features = false, features = ["std", "cpu"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
