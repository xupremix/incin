[package]
description = "Machine learning framework for setting fire to dimensionality bugs"
repository.workspace = true
authors.workspace = true
name = "incin"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["machine-learning", "deep-learning", "tensor", "neural-network", "autograd"]
categories = ["science", "mathematics", "no-std"]
documentation = "https://docs.rs/incin"

exclude = [
    "*.onnx",
]

[lints]
workspace = true

[lib]
bench = false

[features]
# The normal installation is a standard-library CPU build.
default = ["std", "cpu"]
# Enables standard-library functionality, serialization, and filesystem APIs.
std = ["incin-core/std", "incin-macros/std", "incin-backends/std"]
# Enables nightly-only APIs in the core and macro crates.
nightly = ["incin-core/nightly", "incin-macros/nightly"]
# Enables the built-in CPU backend. This is the only default backend.
cpu = ["std", "incin-backends/cpu"]
# Hands large f32 CPU matmuls to a blocked GEMM. The CPU backend is complete
# without it; see incin-backends for what it does and does not change.
cpu-blas = ["std", "cpu", "incin-backends/cpu-blas"]
# Preview: the native CUDA backend, covering the subset in docs/capabilities.md. Never enabled implicitly.
cuda = ["std", "incin-core/cuda", "incin-backends/cuda"]
# Preview: the cross-platform WGPU backend, covering the subset in docs/capabilities.md. Never enabled implicitly.
wgpu = ["std", "incin-backends/wgpu"]
# Preview: the native Metal backend for Apple Silicon. Its executors are stubs pending MTL-002/003; see docs/capabilities.md. Never enabled implicitly.
metal = ["std", "incin-backends/metal"]
# Enables MPS and MPSGraph structured primitives for Apple Silicon.
metal-mps = ["metal", "incin-backends/metal-mps"]


# Lets `cargo incin doctor --check-updates` ask crates.io whether a newer
# incin exists. Off by default: it is the only feature that can reach the
# network, and no build should gain that ability without asking for it.
update-check = ["std", "dep:ureq"]

# Enables the external Candle backend at `incin::external::candle`.
external-candle = ["std", "incin-backends/external-candle"]


# Enables CUDA launch autotuning.
autotune = ["cuda", "incin-backends/autotune"]
# Enables the preview trainer at `incin::experimental::training`. The
# interface may change without a migration path.
train = ["std"]
# Preview: typed meshes, static/runtime tensor placements, and distributed
# lowering proofs. This is a planning and validation layer; there is no
# distributed execution path. Transports remain separate opt-in backend features.
distributed = ["incin-core/distributed", "incin-macros/distributed"]
# Enables the deterministic in-process collective transport used by
# conformance tests and local distributed-plan development.
distributed-reference = ["distributed", "incin-backends/distributed-reference"]
# Two-host process-per-rank CUDA transport and its TCP bootstrap.
distributed-nccl = ["distributed", "cuda", "incin-backends/distributed-nccl"]
# Enables backend telemetry hooks. `cargo incin doctor` also reports the run
# directory under this feature, which is why the dependency is direct here and
# not only through incin-backends.
telemetry = ["std", "incin-backends/telemetry", "dep:incin-telemetry"]
# Deterministic fault-injection hooks for tests. No stand-in backend: a test
# that needs a backend uses a real one.
test-utils = ["std", "cpu", "incin-backends/test-utils"]
# Extension contracts for backend authors.
backend-authoring = []
# The Hugging Face Hub client at `incin::hub`. Off by default because it brings
# an async runtime and a second TLS stack into the dependency graph for an API
# most training code never calls; dataset downloading does not need it.
data-hub = ["std", "incin-data/hub"]
# Preview-only CPU reference evaluator and plan-inspection types under
# `incin::experimental::compiled`. No stable API, deployment format, or
# portable artifact ABI is promised.
compiled = ["std", "cpu", "incin-core/compiled", "incin-backends/compiled"]
# Opt-in only: ignored multi-host CUDA runtime fixtures require actual hardware
# and are not part of compile-only feature coverage.
hardware-tests = ["distributed-nccl"]

# Authoritative release-support classification for every public feature. The
# `cargo xtask docs` generator validates this table against `[features]` and
# renders the README, feature matrix, and book inventory from it.
[package.metadata.incin.feature-contract]
std = { tier = "stable", owner = "facade", prerequisites = [], hardware = "none" }
nightly = { tier = "preview", owner = "facade", prerequisites = [], hardware = "nightly" }
cpu = { tier = "stable", owner = "facade", prerequisites = ["std"], hardware = "none" }
cpu-blas = { tier = "stable", owner = "facade", prerequisites = ["std", "cpu"], hardware = "none" }
cuda = { tier = "preview", owner = "facade", prerequisites = ["std"], hardware = "cuda" }
wgpu = { tier = "preview", owner = "facade", prerequisites = ["std"], hardware = "wgpu" }
metal = { tier = "preview", owner = "facade", prerequisites = ["std"], hardware = "apple-silicon" }
metal-mps = { tier = "preview", owner = "facade", prerequisites = ["metal"], hardware = "apple-silicon" }
external-candle = { tier = "stable", owner = "facade", prerequisites = ["std"], hardware = "none" }
update-check = { tier = "stable", owner = "facade", prerequisites = ["std"], hardware = "none" }
autotune = { tier = "preview", owner = "facade", prerequisites = ["cuda"], hardware = "cuda" }
train = { tier = "preview", owner = "facade", prerequisites = ["std"], hardware = "none" }
distributed = { tier = "preview", owner = "facade", prerequisites = [], hardware = "none" }
distributed-reference = { tier = "preview", owner = "facade", prerequisites = ["distributed"], hardware = "none" }
distributed-nccl = { tier = "preview", owner = "facade", prerequisites = ["distributed", "cuda"], hardware = "multi-host-cuda" }
telemetry = { tier = "stable", owner = "facade", prerequisites = ["std"], hardware = "none" }
test-utils = { tier = "test-only", owner = "facade", prerequisites = ["std", "cpu"], hardware = "none" }
backend-authoring = { tier = "stable", owner = "facade", prerequisites = [], hardware = "none" }
data-hub = { tier = "stable", owner = "facade", prerequisites = ["std"], hardware = "network" }
compiled = { tier = "preview", owner = "facade", prerequisites = ["std", "cpu"], hardware = "none" }
hardware-tests = { tier = "hardware-only", owner = "facade", prerequisites = ["distributed-nccl"], hardware = "multi-host-cuda" }

[dependencies]
incin-core = { path = "../incin-core", version = "0.1.0", default-features = false }
incin-macros = { path = "../incin-macros/", version = "0.1.0", default-features = false }
incin-backends = { path = "../incin-backends", version = "0.1.0", default-features = false }
incin-data = { version = "0.1.0", path = "../incin-data" }
incin-diagnostics = { version = "0.1.0", path = "../incin-diagnostics" }
incin-telemetry = { version = "0.1.0", path = "../incin-telemetry", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for `cargo incin doctor --check-updates`, which is opt-in twice over:
# the feature below is off by default and the flag must still be typed.
ureq = { version = "3.3.0", optional = true }

[[bin]]
name = "cargo-incin"
path = "src/bin/cargo-incin.rs"
bench = false
required-features = ["std"]

[dev-dependencies]
incin = { path = ".", features = ["backend-authoring", "test-utils", "wgpu", "cpu", "train"] }
hashbrown = "0.14.5"
bytemuck = "1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1.0.117"

# The examples and the benchmark are binaries, so the crate-level `#![cfg]` the
# integration tests use would leave them without a `main` rather than skipping
# them. `required-features` is the mechanism that skips a binary target, and it
# is what lets the feature powerset build every combination.
[[bench]]
name = "baselines"
harness = false
required-features = ["cpu"]

[[example]]
name = "batched_matmul"
required-features = ["cpu"]

[[example]]
name = "mnist_training"
required-features = ["cpu"]

# The `cargo incin new mnist` scaffold, compiled from the template file itself
# rather than from a copy of it. The template went stale precisely because
# nothing built it: it imported a name that had moved out of the crate root and
# handed `cross_entropy_loss` a float where it reads a class index. Pointing an
# example straight at the file is what makes a scaffold that cannot compile a
# failing build rather than a bad first impression.
[[example]]
name = "scaffold_mnist"
path = "src/bin/templates/mnist/main.rs.template"
required-features = ["cpu", "telemetry"]

[[example]]
name = "transformer_block"
required-features = ["cpu"]

[[example]]
name = "rnn_sequence_prediction"
required-features = ["cpu"]

[[example]]
name = "native_resnet"
required-features = ["backend-authoring", "cpu"]

[[example]]
name = "cuda_pipeline"
required-features = ["cuda"]

[[example]]
name = "model_building_transformer"
required-features = ["cpu"]

[[example]]
name = "custom_backend"
required-features = ["cpu", "backend-authoring"]

[[example]]
name = "custom_dtype_and_operation"
required-features = ["cpu", "backend-authoring"]

[[example]]
name = "dynamic_to_static_bridging"
required-features = ["cpu"]

[[example]]
name = "safetensors_hub_pipeline"
required-features = ["cpu"]

[[example]]
name = "advanced_math_and_activations"
required-features = ["cpu"]

[[example]]
name = "target_api_dynamic"
required-features = ["cpu"]

[package.metadata.docs.rs]
# docs.rs builds the default feature set unless told otherwise, which would
# document a fraction of this crate. Hardware-only features are deliberately
# absent: docs.rs has no GPU and a build that cannot link is worse than a
# page that says the feature exists.
features = ["cpu", "std", "cpu-blas", "external-candle", "update-check", "telemetry", "backend-authoring", "data-hub", "train", "compiled", "distributed", "test-utils"]
rustdoc-args = ["--cfg", "docsrs"]
