[package]
authors = ["xupremix <xupremix.me@gmail.com>"]
name = "kindle-core"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
std = [
    "thiserror/std",
    "half/std",
    "anyhow/std",
    "serde/std",
    "prost/std",
    "bytes/std",
    "safetensors",
    "bincode",
]
nightly = []
cuda = []
metal = []

# candle = ["dep:candle-core", "dep:candle-nn"]
# cuda = ["dep:candle-core?/cuda", "dep:candle-nn?/cuda"]

[dependencies]
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex", "lazy"] }
kindle-macros = { path = "../kindle-macros", version = "0.1.0", default-features = false }
thiserror = { workspace = true, default-features = false }
half = { workspace = true, default-features = false }
anyhow = { version = "1.0.103", default-features = false }
typenum = { version = "1.20.1", default-features = false }
safetensors = { version = "0.4.1", optional = true } # safetensors requires std
bincode = { version = "1.3.3", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
bytes = { version = "1.12.0", default-features = false }
ggml-quants = "0.1.0"
hashbrown = { version = "0.14", default-features = false, features = ["alloc", "inline-more", "ahash", "serde"] }


[dev-dependencies]
trybuild = "1.0.117"
serde_json = "1.0.120"

[build-dependencies]
prost-build = "0.14.4"
# miette = { workspace = true }
