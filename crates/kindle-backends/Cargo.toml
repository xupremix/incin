[package]
name = "kindle-backends"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[features]
default = ["std", "candle", "ndarray"]
std = ["kindle-core/std", "kindle-native?/std", "anyhow/std", "ndarray?/std"]
candle = ["dep:candle-core", "dep:candle-nn"]
ndarray = ["dep:ndarray"]
burn = ["dep:burn"]
native = ["dep:kindle-native"]
cuda = ["candle-core?/cuda", "candle-nn?/cuda", "burn?/wgpu"]
metal = ["candle-core?/metal", "candle-nn?/metal"]

[dependencies]
kindle-core = { path = "../kindle-core", default-features = false }
anyhow = { version = "1.0.103", default-features = false }
spin = { version = "0.9.8", default-features = false, features = ["rwlock"] }

# Optional Backends
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
ndarray = { version = "0.17.2", optional = true, default-features = false }
burn = { version = "0.21.0", optional = true, features = ["autodiff"] }
burn-ndarray = "0.21.0"
kindle-native = { path = "../kindle-native", optional = true, default-features = false }

[lints]
workspace = true
