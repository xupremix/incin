[package]
name = "kindle-backends"
edition.workspace = true
version.workspace = true
readme.workspace = true
license.workspace = true

[features]
default = ["candle", "ndarray"]
candle = ["dep:candle-core", "dep:candle-nn"]
ndarray = ["dep:ndarray"]
burn = ["dep:burn"]
native = ["dep:kindle-native"]
cuda = ["candle-core?/cuda", "candle-nn?/cuda", "burn?/wgpu"]
metal = ["candle-core?/metal", "candle-nn?/metal"]

[dependencies]
kindle-core = { path = "../kindle-core" }
anyhow = "1.0.103"

# Optional Backends
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
ndarray = { version = "0.17.2", optional = true }
burn = { version = "0.21.0", optional = true, features = ["autodiff"] }
burn-ndarray = "0.21.0"
kindle-native = { path = "../kindle-native", optional = true }

[lints]
workspace = true
