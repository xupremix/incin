# Supply-chain policy for the Incin workspace, enforced by `cargo deny check`.
#
# The workspace previously had no advisory, licence, or duplicate gate at all,
# which is how `onnx-pb` — unreleased since 2020 — kept a second `prost` major
# in the tree beside the one `incin-core` uses. A duplicate that arrives by
# accident is now visible in CI; a duplicate that is genuinely unavoidable is a
# `skip` entry with a reason attached to it.

[graph]
# Every target the feature matrix compiles for. Restricting the graph keeps
# platform-specific duplicates (Windows API shims, Apple frameworks) from being
# reported against a Linux CI run that cannot act on them.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is archived upstream with no successor and no known
    # vulnerability. It arrives through the GPU and quantization stacks
    # (`cudarc`, `ggml-quants`, `metal`), none of which incin controls, so the
    # only action available is to record that it was seen and judged.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, not vulnerable; transitive through cudarc/ggml-quants/metal" },
]

[licenses]
version = 2
# Incin is MIT OR Apache-2.0. These are the licences its dependency graph
# actually resolves to; a new one is a deliberate decision, not a silent
# addition.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
    # Public-domain-equivalent, both more permissive than MIT.
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.9

# The workspace's own `publish = false` members — the example crates and
# `xtask` — carry no licence field because they are never published. Checking
# them would report the repository against itself.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The example crates depend on the facade by path with no version, which is
# correct for a member that is never published and is not the wildcard this
# check exists to catch.
allow-wildcard-paths = true

# Duplicates that are understood and cannot be resolved from inside this
# workspace. Anything not listed here is reported.
skip = [
    # Pulled by `candle-core` 0.9, which is an optional external backend behind
    # `external-candle`. Removing them means moving Candle to 0.11, which is a
    # separate change with its own API migration.
    { crate = "rand@0.9", reason = "candle-core 0.9 has not moved to rand 0.10" },
    { crate = "safetensors@0.7", reason = "candle-core 0.9 pins its own safetensors" },
    { crate = "rand_distr@0.5", reason = "arrives with candle-core's rand 0.9" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
