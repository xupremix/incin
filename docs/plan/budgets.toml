# Deterministic governance budgets (GOV-005).
#
# Runtime maxima are checked against the versioned GOV-004 confidence-interval
# upper bounds, not against noisy CI wall-clock samples. TUN-008 and CI-006 add
# live performance, memory, and cache gates. A changed workload receives a new
# series ID; a deliberate budget change updates both baseline_* and max_* in a
# reviewed commit. Every baseline runtime and *_bytes metric must appear once.
schema = 1
baseline = "docs/plan/baselines/main.toml"

[[runtime]]
id = "capability/cpu/f32_create"
backend = "cpu"
baseline_high_ns = 87.543
max_high_ns = 110.0

