# Cargo feature inventory. Values are compared as sets, so harmless ordering
# changes do not fail the gate; names, defaults, and forwarding are exact.

# CUDA series, captured on the cuda_host environment recorded in the
# baseline document. Accelerator runtime bounds use the 1.5x headroom the
# WGPU rows use, not the 1.25x the CPU rows use: a GPU shares the device
# with a compositor and its samples are correspondingly noisier.

[[runtime]]
id = "capability/cuda/f32_create"
backend = "cuda"
baseline_high_ns = 183790000.0
max_high_ns = 275685000.0

[[runtime]]
id = "gpu/cuda/add_f32/65536"
backend = "cuda"
baseline_high_ns = 15524.0
max_high_ns = 23286.0

[[runtime]]
id = "gpu/cuda/matmul_f32/64"
backend = "cuda"
baseline_high_ns = 24408.0
max_high_ns = 36612.0

