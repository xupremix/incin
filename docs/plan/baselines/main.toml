note = "First captured at 183 ms, which was a defect rather than a device cost. CudaContext::new retains the device primary context, so every call returns the same context, but cuda_from_bytes built a fresh Arc per tensor; the last one dropped released the primary context and the next allocation paid full re-initialization. Measured directly: 131 ms with no context held against 1 us with one held. Routing allocation through the process-wide cache in cuda/gpu.rs holds one handle for the life of the process and moved this series from 183 ms to 4.93 us."

