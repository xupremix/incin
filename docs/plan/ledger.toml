[[task]]
id = "PRF-001"
tier = "core"
theme = "perf"
status = "complete"
deps = ["EXE-003", "EXE-004"]
target = ["crates/incin-backends/src/iteration.rs"]
deliverable = "Remove repeated hot-path metadata allocation; latency and allocation evidence"
evidence = ["cargo bench -p incin -- eager"]
completed_on = "2026-07-28"
completed_evidence = "cargo bench -p incin -- eager, run on this host against a detached worktree at 556ce7a: eager/add_f32/1024 went from 723.47/726.73/730.11 ns to 655.91/658.75/662.37 ns and eager/add_f32/65536 from 6.4156/6.4327/6.4477 to 5.9882/6.0504/6.1027 us. capability/cpu/f32_create moved from 267.56/268.43/269.26 to 257.08/258.16/259.21 ns. The sum and matmul series are unchanged within overlapping confidence intervals, which is expected: neither builds an iteration plan. The allocation half is a test rather than a number in a comment, at crates/incin/tests/hot_path_allocations.rs, with a per-thread counting global allocator. A rank-2 broadcasting add cost 21 allocations before this row and costs 13 now; an aligned one cost 15 and costs 13. The two are now asserted equal, which is the invariant: describing a broadcast operand costs nothing that describing an aligned one does not. A rank-6 broadcasting add is asserted to cost exactly what the rank-2 one does, which fails if INLINE_RANK is ever lowered under the ranks the frontend can express. IterationPlan and UnaryIterationPlan hold ShapeBuf and StrideBuf rather than Vec, so nothing in a plan allocates for a rank the typed frontend can express. coalesce_dimensions took a vector of vectors for per-operand working strides and now takes a fixed-size array behind a const operand count, removing the outer allocation and one per operand. normalize_operand builds by pushing instead of indexing into a zero-filled vector. That is six allocations per planned operation. The other two came from cpu::stride::is_contiguous, which answered a question about an existing stride list by materializing a second one and comparing. It walks the axes now. It is called on both operands of every elementwise op, so a bench whose operands are aligned and never reach the plan at all still moved 9.4 percent at 1024 elements, which is where a small operation's metadata cost actually shows up."
deviations = [
  "The row names crates/incin-backends/src/iteration.rs and the fix is not confined to it. Two of the eight allocations removed were in cpu::stride::is_contiguous, which is not the plan but is on the same hot path and was the single largest remaining source: it built a stride vector on every call in order to compare it against one that already existed, twice per elementwise operation. Leaving it would have meant a row about removing repeated hot-path metadata allocation that walked past the most repeated one in the file next door.",
  "Eleven allocations remain on a rank-2 binary elementwise operation and the test names what they are rather than treating 13 as a target. Two hold the result and its Arc and two are the tape entry. The rest are rank-2 dimension and stride vectors passed between the tensor frontend, the backend shape accessor and the storage constructor, all of which take and return Vec<usize> in their signatures. Removing those means changing CpuStorage::try_from_parts and Backend::shape to speak ShapeBuf and StrideBuf, which is a signature change across the backend surface EXE-009 is still removing. Doing it underneath that work would be churn against a moving file.",
  "The improvement is not written back into docs/plan/baselines/main.toml. The eager series there were captured on the [environment] host and the numbers above are from the second host, and the README forbids rewriting a series from a machine that did not produce it. There is also no allocation series to add: the budget schema carries runtime nanoseconds and artifact bytes, and an allocation count is neither, so the assertion lives in the test suite where it runs on every push rather than in a document that is only checked when someone re-benchmarks.",
]

[[task]]
id = "PRF-002"
tier = "core"
theme = "perf"
status = "complete"
deps = ["EXE-007"]
target = ["crates/incin-backends/src/cpu/ops/matmul.rs"]
deliverable = "CPU iteration plans, batched GEMM, optional cpu-blas, and isolated bare-CPU tests"
evidence = ["cargo test -p incin-backends --no-default-features --features std,cpu"]
completed_on = "2026-07-28"
completed_evidence = "cargo test -p incin-backends --no-default-features --features std,cpu -> 283 passed, 0 failed, 1 ignored across the library and every integration target, and the same command with cpu-blas added -> 284 passed, 0 failed. Both are now CI steps rather than local-only claims. cargo bench -p incin --bench baselines -- eager, run on this host against a detached worktree at 0e46f20 for the before numbers: eager/batched_matmul_f32/32x64 went from 1.9843/1.9931/2.0011 ms to 890.90/899.78/907.77 us, eager/matmul_f32/16 from 3.1188/3.1353/3.1525 us to 1.9857/2.0040/2.0361 us, and eager/matmul_f32/64 from 44.101/44.297/44.483 us to 27.831/27.952/28.078 us. The batch driver no longer expands and reshapes both operands to the broadcast shape before looping. It builds one IterationPlan over the batch axes only, reusing the normalization crate::iteration already performs for elementwise ops, and reads each slice in place through a base offset the plan computes. The rank-2 kernels moved with it: every operand is now addressed through a MatrixView, three numbers rather than a CpuStorage::get call that resolved a logical multi-index against heap-allocated shape and stride vectors on every element, which is where the 1.5x on the unbatched series comes from. Two defects fell out of the rewrite and are covered by tests. A contiguous non-f32 matmul returned all zeros: the row-streaming kernel was selected on stride alone and then bailed out on finding a buffer it could not read, leaving the zeroed output as the answer, so an f64 tensor times the identity produced zeros through the public TensorOps::matmul. It now falls through to the double-accumulating kernel instead. And a batched matmul recorded one tape entry per batch slice plus one, because the batch loop called the tape-recording unbatched entry point; the forward computation is now a separate function from the recording wrapper, so a batch of eight records one entry and a backward walk leaves the tape it drained at zero. cpu-blas is new, off by default, and implies std and cpu. It routes f32 products of roughly 64 cubed or larger to matrixmultiply's blocked kernel and declines everything else. Its dispatch is asserted directly, not inferred: the blocked path is proven to take a large product, decline a small one, and decline a dtype it cannot read, so the agreement tests cannot pass on a build where it silently never runs. Kernel agreement is checked against the scalar kernel across both operands contiguous, either transposed, both transposed, and a nonzero view offset. Feature documentation answering all seven points PROPOSALS.md sec. 2.5 requires is written there, and the feature moved from the target table to the current one."
deviations = [
  "The row says optional cpu-blas and the feature table said optional BLAS for large GEMM, which reads as a binding to a system CBLAS. It binds matrixmultiply, a pure-Rust blocked GEMM, instead. A system BLAS cannot be built or tested on either machine this repository has been developed on, since neither carries the development package that provides the link target, and REL-002 verifies with --all-features, so a system binding would make that command fail to link on any host without OpenBLAS installed. Binding a crate that compiles everywhere means the feature is exercised by CI on every push rather than being a compile-time claim, which is the same standard the CUDA deviations were just discharged against. A system CBLAS binding remains possible later as a separate feature; it is not what this one is.",
  "matmul still narrows its output to f32 for every input dtype, so a widened operand loses precision at the boundary rather than in the accumulator. That predates this row and is untouched by it: the double-accumulating kernel already computed in f64 and then narrowed once, and the zero-returning defect fixed here was about which kernel ran, not about what it stored. Widening the output is a dtype question that belongs with the dtype policy, not with a perf row, and doing it here would have changed the result type of every existing matmul test.",
  "eager/batched_matmul_f32/32x64 is recorded under the second host rather than the [environment] host, because that is where it was measured. The two rank-2 matmul series improved on this host by the same rewrite and by a similar factor, but their recorded rows are left exactly as captured: they belong to the [environment] host and the README forbids rewriting a series from a machine that did not produce it. The environment key is still named cuda_host, which is now a historical name for the machine rather than a statement about the backend; renaming it would have meant rewriting GOV-004's recorded deviation text, and the baseline document says plainly what the name means instead.",
  "The new baseline series batches equally on both operands rather than broadcasting one, because the typed Tensor::matmul requires the output to keep the left operand's shape and so cannot express a broadcast batch axis at all. The broadcast path is the one that gained the most, since it is what used to force a materialization, and it is covered by tests at the storage layer. Making it reachable from the typed API is a shape-rule change and is not claimed here.",
]

