completed_evidence = "cargo test -p incin-backends --features distributed-reference -> all library, integration, trybuild, and documentation tests passed. The shared CollectiveBackend contract is dtype-indexed through a GAT and CollectiveDType: supported static dtypes compile, Q8_0 is rejected by a trybuild case, and Dyn resolves and checks DTypeId at runtime before executing the same operation. GroupId rejects empty groups; every launch carries an explicit group, stream, element count, dtype, operation, and returns an event. CollectiveKind owns the adjoint mapping, including all-gather/reduce-scatter, inverse all-to-all, and all-reduce scaling semantics. ReferenceTransport executes deterministic rank-ordered all-reduce, all-gather, reduce-scatter, and all-to-all over typed ReferenceBuffer values and returns structured count, divisibility, dtype, unsupported-mean, and integer-overflow errors. Its ReferenceTopology implementation proves two CUDA ranks connected only by LinkClass::Network and represented by separate ProcessPerRank fingerprints bind to the same MeshId. That test exposed and fixed a physical-identity defect: TopologyFingerprint::digest included each process's local rank, so two processes in one job could never agree on a mesh id. The digest now includes layout kind and world while retaining local rank as an inspectable fingerprint field. cargo check -p incin-backends --no-default-features --features distributed-reference --all-targets, cargo clippy -p incin-backends --features distributed-reference --all-targets -- -D warnings, cargo fmt --all --check, warning-denied rustdoc, workspace tests, ledger, budgets, generated docs, and the shape audit all pass."
