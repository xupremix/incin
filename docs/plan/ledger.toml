[[task]]
id = "CI-005"
tier = "core"
theme = "ci"
status = "complete"
deps = ["GOV-005"]
target = ["crates/incin-macros/tests/"]
deliverable = "Macro trybuild, rustfmt, rename, and hygiene suite for the existing s!, idx!, and #[module]"
evidence = ["cargo test -p incin-macros"]
completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin-macros -> 7 passed, 0 failed, 3 ignored: 4 harness tests, 12 trybuild cases, and the doctests. Before this row that command ran zero tests and exited zero doing it, because crates/incin-macros had no tests/ directory at all. Two defects were found by writing the tests the macro policy already required, and both are the kind that only a test of that exact category finds. The first is hygiene, and it is one character. s!, idx! and #[module] expanded to a relative incin::prelude::..., so a caller with any item named incin in scope had the expansion resolve against theirs; the first probe failed with 'cannot find typenum in prelude' pointing at the caller's own macro invocation. All three are absolute now, and reverting the leading :: in shape.rs alone turns the hygiene case red. model! and import_model! carried the identical defect and are fixed with them: fixing three macros and leaving two with a known one-character bug would have been an arbitrary line. The second is the gap SHP-007 recorded and deferred here in as many words -- 'the struct-level argument is still accepted silently; that gap belongs to CI-005'. #[module]'s arguments were read with attr.to_string().contains(..), so #[module(no_such_argument)] expanded as though it had been written #[module], and #[module(not_internal)] was accepted as internal. The list is parsed against a closed vocabulary now, which is what the policy's 'versioned grammar and reject unknown keys' asks for, and the compile-fail case that first passed when it should have failed is what pins it. Twelve trybuild cases: six compile-pass covering s!'s literal, dyn, underscore, named-path, repeat, head, tail and span forms, idx!'s range, full, ellipsis and infer forms, and #[module]'s plain and no_stats arguments; and six compile-fail, each pinned by the message its macro emits rather than by an error code, since a macro rejection has none. Four harness tests. compile_fail_cases_fail_for_their_stated_reason is SHP-007's guard, which fails a case with no recorded reason and a case whose recorded output shows its own scaffolding failing rather than the macro. every_policy_category_is_covered fails if the hygiene, rename or rustfmt case disappears, because those three are the ones nobody notices missing -- everything compiles without them right up until a user has an item named incin. invoking_the_macros_leaves_a_file_formattable runs rustfmt over a fixture using all three macros and asserts it is a fixed point, since a macro whose invocation form defeats rustfmt costs every downstream user their formatting and nothing else here would notice. The hygiene case puts a decoy in scope for every name the three macros emit -- incin, typenum, Ellipsis, InferDim, Slice, Vec -- and asserts both directions: the expansion does not resolve against them, and they are still the caller's afterwards. The rename case imports nothing from the prelude by glob and names everything through use ::incin as renamed. One consequence had to be repaired rather than worked around. incin-core's stats.rs tests relied on use crate as incin so the old relative path would resolve; an absolute ::incin cannot see a use-alias. They use s![@ ..], the in-crate form the parser has always accepted and nothing in the repository used, which expands to crate::prelude:: instead. The integration crates under tests/ were unaffected: extern crate incin_core as incin does create the crate-root entry. cargo test --workspace -> 1031 passed, 0 failed. cargo clippy --workspace --all-targets -- -D warnings exits zero, cargo fmt --all --check clean, cpu, cpu+wgpu and cpu+cuda all check clean, cargo xtask ledger and budgets ok, tools/audit-shapes.sh --check ok."
deviations = [
  "The row's target column names crates/incin-macros/tests/, and the tests found two defects, so the row also carries crates/incin-macros/src/{shape,idx,module,safetensors,onnx}.rs. A suite that documents a hygiene bug rather than fixing it is not what 'provide hygiene tests' asks for; the alternative was a red suite or a suite that asserts the broken behaviour.",
  "A package rename in the caller's Cargo.toml -- incin_x = { package = \"incin\" } -- still breaks every expansion, because ::incin names a crate that is not there under that name. Resolving the real name needs proc-macro-crate, which reads the caller's manifest at expansion time, and the macro policy four lines above the test requirement forbids exactly that: 'avoid filesystem/network access except existing explicit import macros'. The limit is documented on all three macros rather than worked around, and the rename case tests what is actually supported: any use-alias, and no prelude glob at all.",
  "The three existing macro compile-fail cases stay in incin-core's suite rather than moving to this crate's. They are where a trybuild harness already was, moving them would change nothing about what they assert, and their recorded output would have to be regenerated for a new path. One of them had its comment corrected, since it named this row as owning a gap this row closed.",
  "model! and import_model! are fixed but not tested. They read files at expansion time -- the one exception the macro policy carves out -- so a trybuild case for either needs a fixture model on disk, which is a different kind of test from the six here. They have no row of their own; a suite for them belongs with whichever row next touches the import path.",
  "The rustfmt check skips rather than fails when rustfmt is absent. It is a declared toolchain component so CI always has it, but a contributor on a partial toolchain should not get a failure about something they did not break. The trade is that the check is silently absent there, which is why the fixture is also a compile-pass case: it cannot rot unnoticed.",
]

