completed_evidence = "cargo bench -p incin -- --save-baseline main -> 8 stable CPU Criterion series covering f32/u32 creation, f32 add and sum at 1,024 and 65,536 elements, and f32 matmul at 16 and 64; cargo bench -p incin --features wgpu --bench baselines -- '^(capability/wgpu|gpu/)' --save-baseline wgpu-main -> 3 real WGPU series on the AMD Radeon 680M. docs/plan/baselines/main.toml records 95% confidence intervals, exact feature sets, OS, architecture, CPU, memory, Rust/Cargo/LLVM/Criterion versions, revision, device availability, build time, and raw release artifact sizes. CUDA was originally recorded as explicitly unavailable because no NVIDIA adapter or nvidia-smi executable was present; the CUDA series now exist, captured on a second host. cargo bench -p incin --features cuda --bench baselines -- '^(capability/cuda|gpu/cuda)' --save-baseline cuda-main -> 3 real CUDA series on a GeForce GTX 1650 SUPER (Turing TU116, compute capability 7.5, driver 595.71.05, CUDA 12.6): capability/cuda/f32_create at 183.01 ms, gpu/cuda/add_f32/65536 at 15.459 us, and gpu/cuda/matmul_f32/64 at 24.393 us, each with its 95% interval, plus a compile.cuda profile of eight artifact sizes. cargo xtask budgets -> 14 runtime, 24 artifacts, 5 feature crates, 25 features, up from 11 and 16, with accelerator runtime bounds at the 1.5x headroom the WGPU rows use and artifact bounds at 1.2x. The first CUDA capture was itself a finding, and the finding was a defect rather than a device cost. capability/cuda/f32_create measured 183 ms against 1.8 us for its WGPU counterpart. CudaContext::new retains the device primary context, so every call returns the same context and allocations across them are mutually valid; what is not free is the edge. cuda_from_bytes built a fresh Arc per tensor, so the last one dropped released the primary context and the next allocation paid full re-initialization. A corrected probe separates the two cases exactly: 131 ms per call with no context held, 1.014 us with one held. Routing allocation through the process-wide cache already present in cuda/gpu.rs, behind a new fallible try_get_cuda_device so no panic is added, holds one handle for the life of the process and moved the series to 4.93 us, a 99.997% reduction Criterion reports at p = 0.00. detect.rs::probe_cuda went the same way, since it created a context and dropped it, releasing the primary context immediately after proving it could be created. Baseline and budget moved together in the same commit, as budgets.toml requires. cargo check passes for both default and WGPU benchmark targets; cargo test --workspace completed with no failures, including 32 semantic trybuild cases and all doctests. Formatting, TOML parsing, diff-check, and ledger validation clean. Clippy unavailable: the installed Rust 1.92 toolchain reports cargo-clippy is not applicable."
