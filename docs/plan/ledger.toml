completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin-backends --features external-candle --test conformance -> 8 passed, 0 failed. crates/incin-backends/src/external/conformance.rs is the backend-authoring surface PROPOSALS.md sec. 2.9 describes: a Subject trait carrying the three things only an author can supply (their backend, storage built from values, values read back), Tolerance profiles (EXACT, F32_ACCUMULATED, F32_WIDE), and eight checks that are the same for every backend. Every check asks the capability registry first, because sec. 2.9's closing sentence -- 'an external backend implements only the operation descriptors it supports; missing support is visible through the capability registry' -- means an unclaimed operation must skip rather than fail. A suite that fails a half-written backend for not implementing something it never claimed is a suite authors route around. The eight checks: storage round-trips its values bit-exactly; metadata describes the tensor it came from (shape, dtype, element count, one stride per axis); matmul is within the declared tolerance against a reference computed in the harness rather than by the subject; the matmul output shape matches the validated descriptor, because a proof the executor does not honour is worse than no proof; matmul rejects a wrong input count, since Validated proves shapes and the handles arrive separately; reshape preserves element order exactly, because reshape re-addresses and must not compute; reshape rejects an operand whose shape disagrees with the descriptor; and the registry and the executor agree in both directions plus refuse at least one dtype, because a registry that never says no cannot be planned against. crates/incin-backends/tests/conformance.rs carries the template sec. 2.9 asks for: a complete minimal backend over Vec<f32>, about 150 lines, showing storage validated once at the boundary, capability registration that constrains rank to what the executor can actually run, and two Execute impls that check input arity and operand shape instead of assuming the proof covered them. Prose describing the seven bullets would go stale; a backend that compiles and passes the suite cannot. Most of the value is in the negative controls, and they are the half a conformance suite usually skips: a suite that has never failed a backend is indistinguishable from one that cannot. Four deliberately broken backends sit beside the template and each is asserted to fail exactly the check it breaks, no more so the checks are independent and no fewer so none is vacuous. A registry claiming SupportLevel::Native for everything fails only the_registry_and_the_executor_agree. An executor that indexes request.inputs instead of matching on it panics on a wrong arity and fails only matmul_rejects_a_wrong_input_count -- reported as a failure with the word 'panicked' in it, and the seven checks after it still run, which is the harness's own contract. A backend multiplying its operands the wrong way round produces a correctly shaped result and fails only matmul_is_within_tolerance, which a shape-only suite would have passed. And a backend registering nothing must pass, with exactly five checks skipped and the three that need no registration still running. The Candle adapter is the real subject: a foreign tensor type carrying no TensorMeta of its own, never designed against this contract, passing all eight with nothing skipped. A separate test asserts the two backends were asked the same questions in the same order, since a conformance suite that asks two backends different questions is not one. Two defects fixed to get there. bytes was gated on external-candle alongside cuda and wgpu, but the Candle adapter never allocates by byte length, so --features external-candle without a GPU compiled a module whose only function was dead and cargo clippy -- -D warnings failed on the row's own feature set; the unsupported macros one line below keep that gate, because Candle does use those. The second was a needless_borrow in external/candle/executor.rs. pub mod external was itself gated on external-candle, which put the backend-authoring surface behind one particular integration -- an author writing a backend for an ecosystem this repository has never heard of would have had to enable the Candle adapter to test it. The module is unconditional now, candle inside it keeps the gate, and cargo test -p incin-backends --no-default-features --features std,external-candle --test conformance passes with no native backend compiled at all. Without candle and with cpu it runs 6 of the 8 tests. Five mutants run against the harness, all caught and all compiling. Making every check pass failed 2 tests, making a panic not a failure failed the panic test, making every value within tolerance failed 2, dropping the Skipped entries for an unclaimed operation failed the skip test, and removing the dtype-refusal requirement failed the registry test. cargo test --workspace -> 1064 passed, 0 failed. cargo clippy --workspace --all-targets -- -D warnings exits zero, and so does it for std,cpu, std,cpu,wgpu, std,cpu,external-candle and the default set individually. cargo fmt --all --check clean, cargo xtask ledger and budgets ok, tools/audit-shapes.sh --check ok."
deviations = [
  "The row's target column names crates/incin-backends/src/external/, and pub mod external stopped being gated on external-candle. The backend-authoring surface being reachable only by enabling one particular third-party integration is the opposite of what sec. 2.9 asks for; the Candle adapter inside the module keeps its gate, so nothing new is compiled into a build that did not want it.",
  "The template is a module in tests/conformance.rs rather than a shipped item in src/. D-015 refused to put a TOML parser in cargo-incin because a target shares its crate's dependencies, and the same instinct applies to shipping a reference backend to every downstream user. The template is still in the repository, still compiled, and still asserted to pass the suite on every run, which is what stops it going stale.",
  "The reshape fixture is statically shaped while the matmul fixture is dynamic, so the harness fixes its reshape shape pair instead of taking it as an argument. ReshapeShape carries an ElementCount proof Dyn cannot supply -- that is the rule working, since element count is exactly what reshape must preserve -- so there is no dynamically shaped reshape to lower.",
  "Sec. 2.9 lists autograd parity tests and rules for synchronization, ownership, and device errors; neither becomes a conformance check here. The Candle adapter implements Execute for two descriptors and records no tape, so an autograd check would have nothing to run and no second implementation to be parity with -- GRD-004 is where a second backend's recipes appear. Ownership and device errors are checked where they are observable today: storage validated at the boundary, and an operand that is not this backend's storage rejected rather than panicked on.",
  "The suite does not grow the Candle adapter's operation coverage past the two descriptors EXE-008 migrated. Adding a third would make the row about Candle rather than about the surface, and the harness's shape is what a third descriptor would have to be added to anyway.",
  "The harness catches panics rather than letting them propagate. A backend that panics where the contract says to return a BackendError is the finding, and a harness that dies on it reports one check instead of eight -- the same lesson UX-014 learned when a SIGSEGV took a test binary down and reported nothing at all.",
]

