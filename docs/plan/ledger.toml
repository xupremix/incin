completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin-backends --no-default-features --features std,cpu --lib tape -> 10 passed, 0 failed. That command previously ran zero tests: the file was #![cfg(all(feature = \"cpu\", any(feature = \"wgpu\", feature = \"cuda\")))], so the row's own evidence command compiled nothing under the feature set it names. The crate-level cfg is now bare cpu and the cross-backend cases keep the per-test cfgs they already had. crates/incin-core/src/exec/tape.rs is the node and the walk: one TensorId, a TapeStorage trait naming exactly the three things a reverse walk needs of a backend's storage (identity, a ones seed, a fallible accumulate) plus the NaN predicate, TapeNode<S> holding output, inputs, and recipe, Tape<S> owning the nodes, and GradientMap<S> holding the result. crates/incin-backends/src/cpu/tape.rs lost 130 lines and gained 103: what is left is the TapeStorage impl, the thread-local, the telemetry hooks, and unbroadcast. Its reverse walk, accumulation loop, gradient map, and NaN check are gone, and so are the WGPU and CUDA copies' future duplicates -- GRD-004 migrates those two on hardware. Three TensorId(u64) newtypes over three independent counters became one, re-exported from each backend's storage module so no call site changed. The walk takes its nodes by value rather than borrowing a Tape, and that is not a style choice: the first migration held the RefCell across the walk and four convolution tests failed with 'RefCell already borrowed'. Conv backward is built out of other backend operations, each of which records, so a walk that still held the tape re-entered it. D-06 said drain before invoking anything and was a comment; taking Vec<TapeNode<S>> by value makes it structural, since there is no way to call the walk without having already taken the nodes out. Ten CPU cases assert calculus rather than a recording of the previous implementation: a product differentiating to the other operand, x+x differentiating to 2 and x*x to 2x (the CPUBACK-05 accumulate-not-overwrite gate, following the walk into the core), a three-factor chain, a ones seed masked by relu, drain proven by a second backward over the same loss returning only the seed, an unrelated node skipped rather than failed, hand-computed conv2d input and weight gradients, id uniqueness, and the NaN check's message. Three mutants were run against the finished suite. A bare insert instead of accumulate failed 3 tests. Walking forward instead of in reverse initially failed none -- every case was one operation deep -- which is why the three-factor chain test exists; it fails on that mutant. Holding the RefCell across the walk failed the conv reentrancy test, which is the defect that shaped the signature. cargo test --workspace -> 1016 passed, 0 failed. cargo test -p incin-backends --no-default-features --features std,cpu -> 341 passed, 0 failed, 2 ignored. cpu+wgpu, cpu+cuda, and cpu+external-candle all check clean. cargo check -p incin-core --no-default-features surfaced that GradMode::current was std-only while Tape::push needs it; it is now defined in both cfgs, returning the default without std where nothing can install a scope. cargo clippy --workspace --all-targets -- -D warnings exits zero, cargo fmt --all --check is clean, and cargo xtask ledger and budgets are ok."
deviations = [
  "TapeNode does not carry the operation kind sec. 1.2.5 lists among a node's contents. Supplying it means editing 116 push sites to name a value nothing reads, and this repository has ruled twice already -- GRD-001 on GradMode, and the same row on AutotunePolicy -- that a field a caller can set and nothing consumes is a worse contract than a missing one. It belongs to the first row that reads it, which is CMP-001 or UX-012.",
  "Saved values are captured by the recipe closure rather than listed in a node field, so 'saved-value handles' is spelled as a capture rather than as data. That is what keeps the node backend-neutral: a field would mean the core naming a storage type it would have to hold. It is also what makes GRD-002's refusal release them, since they live in the Box that is dropped. GRD-006 owns giving the graph their lifetime, and that is the row that needs them visible.",
  "Only the CPU backend moves onto the core node in this row. WGPU and CUDA keep their own walks, because GRD-004 owns their migration and asserts it on hardware this host does not have; changing two backends whose evidence cannot be produced is how a green local run becomes a broken hardware CI job.",
  "The backward closure stays Fn(&S) -> Vec<S>. EXE-008 recorded that making it fallible touches nineteen WGPU closures and deferred it to 'the explicit gradient context in GRD-001', which has since landed without it; the row that actually owns error typing is GRD-005, 'structured backward and NaN failures; no expected-failure panic paths', and the panic! in the NaN check moved as-is rather than being redesigned here.",
  "cpu::tape::backward and backward_with_nan_check are two functions over one walk parameterized by a NanCheck flag, where the RFC implies one path. Merging them into a single fallible entry point is GRD-005's call to make, since the difference between them is entirely what happens when a gradient is not finite.",
]

