deliverable = "Checked inline ShapeBuf and StrideBuf with checked numel and byte_len, plus property tests"
evidence = ["cargo test -p incin-core --test shape_buf"]
completed_on = "2026-07-27"
completed_evidence = "cargo test -p incin-core --test shape_buf -> 17 passed; 0 failed. shapes/buf.rs adds InlineOrHeap (inline to INLINE_RANK=8, spills to Vec), ShapeBuf, and StrideBuf. checked_numel/checked_byte_len/contiguous_for/checked_span all use checked_mul and return ShapeError::ArithmeticOverflow naming the failing term; no derived value is cached. Properties are checked against u128 references over 5000 cases each from a fixed-seed generator biased to 0/1/usize::MAX/2^32, with assertions that both the overflow and non-overflow branches were reached. The suite found a real ordering bug in the first implementation: a left-to-right fold made numel([MAX,0,MAX]) = Ok(0) but numel([MAX,MAX,0]) = Err, so the zero case is now short-circuited and order independence is pinned by numel_does_not_depend_on_axis_order (reversal plus rotation). Replaces the panicking cpu::stride::contiguous_strides; EXE-004 migrates the storages. Workspace check, no-default-features check, and cargo test -p incin-core all clean"
deviations = []

[[task]]
id = "SHP-004"
tier = "core"
theme = "shape"
status = "complete"
deps = ["SHP-003"]
target = ["crates/incin-core/src/shapes/{broadcast,reshape,shape_ops}.rs", "crates/incin-core/src/tensor/ops/"]
deliverable = "Fallible broadcast, reshape, and flatten with no panic or sentinel output; the from_dyn().unwrap() chain is removed"
evidence = ["cargo test -p incin-core --test shape_fallible"]
completed_on = "2026-07-27"
completed_evidence = "cargo test -p incin-core --test shape_fallible -> 13 passed; 0 failed; full workspace 733 passed, 0 failed. The from_dyn().unwrap() chain is at 0, down from the corrected baseline of 39 live sites across 11 files (tools/audit-shapes.sh --check). The shapes surface fell from 13 unwraps to 1 and from 1 panic!-class site to 0. BroadcastShape::output_shape and MatMulShape::output_shape are now fallible; shapes/shape.rs adds field_from_dims() and error.rs adds ShapeError::TargetShapeRejected for the residual generic cases. checked_broadcast_dim converted from assert! to Result per decision D-013, and the named_dims.rs test that asserted the panic now asserts the error and its axis. Three latent wrong-answer bugs found and fixed while converting: (1) broadcast used lhs.max(rhs), so a size-1 axis against a size-0 one yielded 1 instead of 0; (2) Dyn matmul returned vec![] -- the scalar shape -- as a sentinel for every unmatched rank combination, including [m,k] x [k], whose answer is [m] not a scalar; (3) no MatMulShape impl ever checked the contracted dimension, so a disagreeing K produced a confidently wrong output shape (now DimensionMismatch on axis 'k'). The rank-4 x rank-2 'flattened batch' convention is preserved deliberately and pinned by a test. broadcast_dims' unreachable!() arm is gone: a missing axis is now an implicit 1, which is the actual right-alignment rule. no-default-features check clean"
deviations = []

[[task]]
id = "SHP-005"
tier = "core"
theme = "shape"
status = "complete"
deps = ["SHP-003"]
target = ["crates/incin-core/src/shapes/spatial.rs"]
deliverable = "Fallible matmul, conv, and pool geometry as a named checked sequence; rejects stride 0 and stops zeroing spatial dims"
evidence = ["cargo test -p incin-core --test spatial_geometry"]
completed_on = "2026-07-27"
completed_evidence = "cargo test -p incin-core --test spatial_geometry -> 17 passed; 0 failed; full workspace 709 passed, 0 failed. spatial.rs gains spatial_out_size(), a named checked sequence for (in + 2p - d*(k-1) - 1)/s + 1: it rejects a 0 stride/kernel/dilation by parameter name, reports a kernel that does not fit its padded input as EmptyOutput instead of underflowing the subtraction, and names each overflowing term individually ('2 * padding', 'input + 2 * padding', 'dilation * (kernel - 1)'). compute_output_shape on Pool2dShape, SpatialConv1d, SpatialConv2d, and AdaptiveAvgPool2dShape now returns Result<Field, ShapeError>; 10 call sites take ?. Confirmed regression closed: pool2d on (U1,U1,usize,usize) with 8x8/k2/s2/p0/d1 returns (4,4), was (0,0). Two further silent defects found and fixed while here: the Dyn conv/pool rules tested len()==4 (or ==3) and returned the input shape unchanged for every other rank, so rank-3 (C,H,W) was never pooled and an unsupported rank was never reported; both accepted ranks are now handled and others report RankMismatch. from_size().unwrap() 2->0 and Default::default() in spatial output 4->0, both verified by tools/audit-shapes.sh --check. The audit's rank scan was corrected twice in the process (variadic macros with fixed trailing tuple elements were undercounted: SpatialConv1d 5->7, SpatialConv2d 4->7; and the repetition-strip pattern missed the $(..)+ form, inflating BroadcastShape 4->6); the SHP-001 exit table also said 9 rules short of rank 8 while its own table listed 14, now corrected. A third measurement fix re-baselined SHP-004: the from_dyn().unwrap() chain was counted with a regex that stops at the first inner ')', so it never matched from_dyn(&broadcast_dims::<Self, (A, B)>(lhs, rhs)).unwrap() -- 14 of the sites were invisible. Counted by balancing parentheses the true figure is 39 live sites across 11 files, not 28"
deviations = []

[[task]]
id = "SHP-006"
tier = "core"
theme = "shape"
status = "complete"
deps = ["SHP-001"]
target = ["crates/incin-macros/src/rank.rs", "crates/incin-core/src/shapes/"]
deliverable = "One rank generator behind a single MAX_RANK; closes the ElementCount rank-4 versus Shape rank-8 gap"
evidence = ["cargo test -p incin-core --test rank_matrix"]
completed_on = "2026-07-27"
completed_evidence = "cargo test -p incin-core --test rank_matrix -> 13 passed; 0 failed; full workspace 746 passed, 0 failed. MAX_RANK now lives only in crates/incin-macros/src/rank.rs and is re-exported as incin_core::shapes::MAX_RANK (a proc-macro crate cannot export a const, and a second copy would reintroduce the drift). rank_sweep! generates every ladder from it, with nine forms covering the argument shapes the existing macro_rules families accept, including two-dimensional rank-pair sweeps for broadcast prepend and rank x axis sweeps for concat and stack; a `max` above MAX_RANK is rejected so no rule can set its own ceiling. All 19 rules now sit at their correct ceiling: 17 rank-preserving at 8, and AppendDim/StackShape at 7 because their Output gains an axis and is bounded by Shape. Nothing sits above the ceiling. Closes the RFC's motivating gap, ElementCount 4->8. Notable finds: ReplaceLastDim generated impls to rank 12, four ranks at which no tuple implements Shape at all, so they could never be selected; HasChannels1D and HasChannels2D each held for exactly ONE rank, so (C, L) and (C, H, W) -- the unbatched forms their own docs name as valid -- did not implement them. 48 hand-written per-axis impls in concat.rs and stack.rs replaced by two macros. Recorded cost: raising a marker trait from one impl to eight loses rustc's 'but trait X is implemented for it' hint, so those diagnostics are less specific; the on_unimplemented note still carries the guidance and the compile failure is unchanged. 11 compile_fail expectations regenerated, every case still errors. The audit tool needed three corrections to measure this honestly, all documented in the inventory. Compile time unchanged (incin-core check ~1.4s). no-default-features clean"
