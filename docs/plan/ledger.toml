[[task]]
id = "UX-001"
tier = "preview"
theme = "ux"
status = "complete"
deps = ["EXE-005"]
target = ["crates/incin/src/train.rs"]
deliverable = "Automatic Trainer; an unchanged model runs on CPU and on three GPUs"
evidence = ["cargo test -p incin --features train --test trainer"]
completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin --features train --test trainer -> 16 passed, 0 failed. incin::train builds level 1 of sec. 2's three-level UX ladder -- 'select three devices and let Incin produce and explain a safe plan' -- and the sentence after that list is what shaped the row: ''Easy' must not mean silent CPU transfer, hidden padding, relaxed determinism, or unbounded autotuning. Every automatic decision is inspectable and reproducible.' A Trainer that quietly runs on the CPU when the CUDA devices it was handed are absent is worse than no Trainer, because the failure mode is a training run that finishes. Six of the sixteen tests therefore assert a refusal. The two ways a device request can fail are separate variants because their fixes are separate: NotCompiledIn names the Cargo feature that would add the backend, DeviceUnavailable names the device that is not present. A single 'cannot use CUDA' would have been true and useless. Asking for four GPUs on a three-GPU machine names cuda:3 rather than quietly planning three. DeviceSet and DevicePreference are separate types in incin-core::tensor::device, which is the row's half of Appendix A.8. A preference is resolved against a machine and may land somewhere the caller did not name; a set is already resolved and may not. Keeping them apart is what makes 'I asked for CUDA and got CPU' something the API can refuse rather than express. DevicePreference::Fastest is the one variant permitted to reach the CPU, because it is the one where the caller said they did not mind -- and even then every family it skipped appears in the plan's decisions, since a fallback nobody can see is the silent one under another name. The default is Cpu rather than Fastest: a default that moves an unchanged program onto a GPU the day one appears is the same class of surprise as one that moves it off. DeviceSet rejects an empty set, a repeated device, and a mix of backend families, each with its own error. Appendix A.8 also lists BackendKind for this row. That type already exists as DeviceKind, whose documented definition is 'the runtime-identifiable backend family a DeviceId belongs to', so it was not built -- D-008 records what two vocabularies for one concept cost. Availability sits behind a Machine trait, two methods, for the reason UX-014 put the doctor's hardware questions behind Host: the row's deliverable is that an unchanged model runs on CPU and on three GPUs, and a test that can only describe the runner it happens to be on cannot check the second half. A three-GPU machine costs a unit struct. Four are defined -- three CUDA devices, CUDA compiled in but absent, CPU only, and nothing compiled in -- and the model fixture is written once at the top of the file and used by both halves, its signature taking no device argument being itself the assertion. The row does not pretend to do DST-011's or DST-005's work. ParallelStrategy is DST-011's and .explain() as a rendered planning report is UX-005's, which depends on both this row and DST-011, so the builder has no .parallel() method -- a field accepting a strategy nothing can plan is a field nothing reads. Multi-device execution needs DST-005's collectives, so fit on a multi-device plan returns CollectivesUnavailable naming that row, rather than running on the primary device and reporting success. The plan still validates and reports all three GPUs and records a collectives-required decision at plan time, which is the part that can be true today. Two defects the row's own tests caught. The CPU training test first asserted only that the final loss was finite, which a fit that ran the forward pass and never called the optimizer would also satisfy; it now probes the same model instance before and after training and asserts the number changed. That assertion failed immediately, and the cause was the fixture rather than the trainer -- the model was Linear -> ReLU, and ReLU(Linear(ones)) can put every output unit on the flat side for an unlucky initialization, making the gradient exactly zero. The fixture is a two-layer MLP with the ReLU in the middle now. Second, the row's evidence command as written in the ledger ran zero tests and printed 'ok': Appendix B requires a preview-tier row to ship behind a non-default Cargo feature and the suite is #![cfg(feature = 'train')]. Marking the row complete on that output would have been the exact failure UX-013 had just spent a row removing, so the command carries --features train (D-053). Adding the feature was itself caught twice by earlier rows' checks, which is the tooling working: UX-014's the_reported_features_are_exactly_the_manifests failed until train was added to the doctor's feature list, and UX-013's cargo xtask docs regenerated README.md's facade matrix with the new row unprompted. Six mutants, all caught and all compiling. Making an absent device fall back to a CPU plan failed 3 tests. Skipping the compiled-in check failed 1. Running a multi-device plan in fit anyway failed 1. Never calling optimizer.step failed 1. Dropping the skipped-family decisions failed 1. Clamping the epoch count to one failed 1. cargo test --workspace -> 1152 passed, 0 failed (the workspace run does not enable train, so the 16 trainer tests are the row's own command). cargo test --workspace --doc -> 76 passed, 0 ignored. cargo clippy --workspace --all-targets -- -D warnings exits zero, and so does cargo clippy -p incin --features train --all-targets. cargo fmt --all --check clean. cargo xtask ledger, budgets, docs --check and tools/audit-shapes.sh --check all ok."
deviations = [
  "Appendix A.8's BackendKind was not built. DeviceKind already means 'the runtime-identifiable backend family a DeviceId belongs to', and a second spelling of one concept is the failure D-008 records. DeviceSet is built from DeviceKind.",
  "DevicePreference and DeviceSet are separate types rather than one enum with a resolve method. A preference may land somewhere the caller did not name and a set may not; collapsing them is what would make 'I asked for CUDA and got CPU' inexpressible as a refusal.",
  "DevicePreference::default() is Cpu rather than Fastest. A default that picks the best available device moves an unchanged program onto a GPU the day one appears, and sec. 2's objection is to the surprise rather than to its direction.",
  "The builder has no .parallel() method, although sec. 2's example calls one. ParallelStrategy is DST-011's and nothing in this workspace can plan against it yet, so accepting one would be a field nothing reads.",
  "Trainer::fit on a multi-device plan returns CollectivesUnavailable naming DST-005 rather than running on the plan's primary device. A three-GPU request that trains on one GPU and reports success is the silent-fallback failure with extra steps.",
  "The row's evidence command gained --features train. As written it ran zero tests and reported ok, because Appendix B requires a preview row behind a non-default feature and the suite is cfg-gated on it.",
  "Trainer::plan() takes no model or optimizer, unlike sec. 2's Trainer::new(model, optimizer). Nothing in the plan depends on either -- planning is about devices -- and taking them early would propagate the builder's type parameters into every error this module returns.",
  "fit takes the loss as a closure rather than deriving it. What a model's loss is cannot be derived from the model, and a trainer that guessed would be guessing at the one thing training is.",
]

