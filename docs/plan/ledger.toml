[[task]]
id = "CI-001"
tier = "core"
theme = "ci"
status = "complete"
deps = ["GOV-005", "GOV-003"]
target = [".github/workflows/ci.yml"]
deliverable = "Feature-powerset CI preserving the bare CPU default; adds cargo doc and drops blanket package exclusions"
evidence = ["act -j powerset  # or CI run"]
completed_on = "2026-07-28"
completed_evidence = "Every step of the new Feature Powerset job run verbatim on this host. cargo hack check --feature-powerset --all-targets over the five feature-bearing crates the budgets inventory tracks: incin-core 24 combinations, incin-macros 3, incin-diagnostics 3, incin-backends 121 in 4m49s, incin 132 in 4m03s, all exit zero. The powerset is complete rather than depth-limited; nightly is excluded because the stable channel rejects the #![feature] it enables, and candle because it expands to exactly external-candle and would double the count without covering anything new. The first run was not green and that is the point of the row. incin-backends --no-default-features --features cpu failed with 104 errors, because the CPU kernels reach for Vec and Box through the std prelude and the autograd tape is a thread_local!: a documented feature pair that had never once compiled, since no job had ever built it. cpu now declares std the way cuda and wgpu already did, docs/plan/budgets.toml records the new forwarding, and cargo xtask budgets -> budgets ok: 15 runtime, 24 artifacts, 5 feature crates, 27 features. The remaining failures were target-level: fourteen incin integration tests, three backend integration tests, and backend integration tests used a backend they never named, and now carry the crate-level #![cfg(feature = \"cpu\")] the rest of the suite already used; the baselines benchmark and three examples carry required-features instead, because cfg-ing a binary out leaves it without a main rather than skipping it. incin-diagnostics compiled its unit tests only under std, since vec! is not in the no_std prelude. The bare CPU default is checked rather than assumed: cargo tree -p incin --edges normal on the default feature set contains no wgpu, cudarc, candle-core, candle-nn, or matrixmultiply, and the positive controls all fire, wgpu adding wgpu v22.1.0, cuda adding cudarc v0.19.8, external-candle adding candle-core v0.9.1 and candle-nn v0.9.1, cpu-blas adding matrixmultiply v0.3.11, and telemetry correctly adding none of them. The blanket exclusions are gone: --exclude backends --exclude tui_graph_demo --exclude native_training_demo left three example crates linted and tested nowhere, and the CPU-capable members are default-members in the root manifest now. cargo clippy --all-targets --no-default-features --features incin-backends/cpu,incin/cpu -- -D warnings exits zero naming no packages, and the WGPU job's new cargo clippy --workspace ... --features incin-backends/cpu,incin-backends/wgpu,incin/cpu,incin/wgpu -- -D warnings exits zero and lints all three of them for the first time. cargo doc gained a second warning-denied build with cpu, cuda, wgpu, telemetry and external-candle all on, which also exits zero. Full local gate clean: cargo fmt --all --check, cargo test --workspace, cargo xtask ledger, cargo xtask budgets, tools/audit-shapes.sh --check."
deviations = [
  "The declared evidence is 'act -j powerset  # or CI run'. act is not installed here and would need a container image carrying the CUDA, WGPU and protobuf system packages the jobs install, so the second branch is what was taken: every step of the new job was run verbatim on this host, and the workflow itself is then proved by the push. What act would have added over that is the runner environment, not the commands.",
  "The row names .github/workflows/ci.yml and the change could not stay inside it. Building the combinations the manifests offer is only possible once those combinations compile, so the row also carries crates/incin-backends/Cargo.toml (cpu now declares std), the root Cargo.toml (default-members), docs/plan/budgets.toml (the forwarding the inventory compares as sets), eighteen test, example and benchmark targets that assumed a backend they never named, and one no_std import in incin-diagnostics. A workflow that names combinations nobody can build is a red job, not a gate.",
  "The powerset job checks compilation, not lints. Three feature configurations carry warnings that only appear when a cfg removes the code that used a binding, most visibly two unused-mut warnings in incin-diagnostics where the filesystem path compiles away under no_std, and denying warnings across 283 combinations would either fail the job on those or require cfg-conditional mut. Clippy stays where it can be held to -D warnings honestly: the CPU feature set over default-members, and the whole workspace with WGPU on.",
  "The row reads 'adds cargo doc', and a warning-denied docs job already existed from GOV-005. What is added is a second build with cuda, wgpu, telemetry and external-candle all enabled at once. The existing build documents only what a default install exposes, so an intra-doc link into incin_backends::cuda -- which resolves only when cuda is on -- could break without CI seeing it. Reading the row as introducing the docs job would credit this one with work GOV-005 did.",
  "default-members lists the CPU-capable members by path rather than deriving them, so a member added later is not automatically in the CPU gate. That is deliberate and the gap is closed on the other side: the WGPU job runs --workspace, which covers every member unconditionally, so a new crate is linted by one job or the other whether or not anybody edits this list. The alternative, a negative glob, does not exist in Cargo, and a bespoke xtask check comparing members against default-members would enforce a list against itself.",
]

