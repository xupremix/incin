completed_evidence = "cargo test -p incin --test doctor -> 25 passed, 0 failed. cargo incin doctor reports toolchain, features, CPU ISA, the three backend families, caches, and capability probes, in stable text and in JSON carrying a schema_version. Twenty-three of the twenty-five tests run against a machine that does not exist, which is the point rather than a shortcut: the report's whole job is to describe hardware, and a test describing this runner's hardware asserts the one configuration with no GPU that every runner here has. Behind the Host trait -- the entire impure surface, six methods -- a three-GPU machine with an unwritable cache, no AVX2, a missing rustc and the deprecated candle alias on costs a struct literal. Assembling the report, deriving its findings and rendering it are pure functions of that trait's answers. The golden test pins the whole text rendering, including all sixteen probe lines. Its capability answers are not mocked and were checked against crates/incin-backends/src/capability.rs rather than recorded from output: the first draft had matmul f16 and reduction f64 the wrong way round on CUDA, which is exactly what a recorded golden would have preserved. Host fakes which hardware is there; the registries are static data compiled into every build, so a mocked CUDA device gets CUDA's real registrations. Findings carry a stable code because a support workflow greps for the code and a human reads the message. One error, no-backend-compiled, which is the only non-zero exit; four warnings, backend-unavailable (the one sec. 2.3 names in as many words), cache-not-writable, deprecated-feature and toolchain-unknown; one note, isa-unavailable. A rejected probe is deliberately not among them. The first draft made one and the healthy-machine test showed the cost: an ordinary CPU laptop opened its report with two notes saying f16 matmul and f64 reduction are unsupported, which is not a fault, is not actionable, and is already in the probe section a few lines up. A test pins the decision, because the obvious improvement is to add it back. Step 6 found a real defect and it was not in the doctor. cargo test --workspace unifies the wgpu feature into incin, and under it the suite died with a SIGSEGV rather than a failure. The doctor's own share was a bug -- gather probed each family twice, once to report it and once to decide what to probe capabilities for -- but fixing that only reduced how often the crash reproduced. Underneath, detect::probe_wgpu built a wgpu::Instance per call and dropped it, and a reduction to two threads each probing twice crashed three times out of three with no doctor code involved at all. cargo incin doctor was the first caller ever to probe the same family more than once in one process. The instance is shared through a OnceLock now, matching what wgpu::device::get_device_state already does with the instance the backend runs on, and detection itself is still performed per call because request_adapter still is. detect.rs carries the regression test, which segfaults without the fix and passes 5 runs out of 5 with it. Step 7 found a third. Pinning the subcommand's exit code to zero failed the --no-default-features --features std build, where no backend is compiled and no-backend-compiled correctly fires -- the diagnostic working, not a bug. The test compares against the report's own verdict now, and a second test asserts the real build agrees with the mock about whether it can run anything, so the error path is exercised by the feature powerset rather than only described by a mock. Read-only is structural rather than aspirational. Writeability is read from mode bits instead of probed by writing, and the telemetry run directory is resolved through a new non-creating incin_telemetry::run_dir::default_run_dir_path rather than default_run_dir, which creates it; that function's own test asserts both halves, the same answer and no directory afterwards. cache_state is public so the contract can be asserted directly: pointing it at a path that does not exist leaves it not existing. Five mutants run against the finished suite, all caught. Inverting backend-unavailable's condition failed 11 tests. Probing every family whether present or not failed 4. Always returning EXIT_OK failed a_build_with_no_backend_at_all_is_an_error. Reading a missing cache path as writable failed inspecting_a_cache_path_does_not_create_it. Silently accepting an unknown flag -- a mutant that compiles -- failed the_argument_vocabulary_is_closed. cargo test --workspace -> 1058 passed, 0 failed. The doctor suite passes under std alone, std+cpu and std+cpu+wgpu. cargo clippy --workspace --all-targets -- -D warnings exits zero, cargo fmt --all --check clean, cargo check -p incin --features telemetry clean, cargo xtask ledger and budgets ok, tools/audit-shapes.sh --check ok."
deviations = [
  "The row's target column names crates/incin/src/bin/cargo-incin.rs, and the report lives in crates/incin/src/doctor.rs instead. The row's own evidence command is cargo test -p incin --test doctor, an integration test, and an integration test links the library rather than the [[bin]]; a doctor written inside cargo-incin.rs could not be reached by the command that is supposed to prove it works. The binary is the dispatcher PROPOSALS.md sec. 2.3 describes it as, twelve lines that call incin::doctor::run and choose a stream.",
  "detect::probe_wgpu and its regression test are in this row rather than in a backends row. Two threads each probing WGPU twice was a reproducible SIGSEGV with no doctor code involved, found by this row's own evidence command and left reachable from a public, documented-as-repeatable entry point. The fix is the pattern the same crate already uses one file over. Leaving a process-killer in place and noting it would have been the alternative.",
  "Sec. 2.3 lists native Metal devices, feature sets, storage modes and MPS availability. There is no Metal row in the report: MTL-001 is planned and unbuilt, and a row reporting 'not available' for a backend that does not exist reads as a hardware finding rather than an absent feature. The same reasoning admits the external-candle row, which does exist, through the feature list.",
  "No cache-cleaning or benchmark flag. Sec. 2.3 permits them as explicit opt-ins rather than requiring them, and the deliverable does not name them. What the row does owe is the default the same sentence states, and that is asserted: cache_state is public so a test can prove that inspecting a path does not create it.",
  "incin gained a direct optional dependency on incin-telemetry, enabled by the existing telemetry feature, so the doctor can report the run directory. The alternative was reproducing dirs' platform logic here, which would drift from the path telemetry actually writes to -- reporting a path that differs from the one in use is worse than reporting none. Under a default build the dependency is absent and the row reads 'not compiled'. docs/plan/budgets.toml records the new forwarding.",
  "A package rename in a caller's manifest is not a concern here, but a related limit is: writeability is inferred from mode bits, not from attempting a write, so ACLs, read-only mounts and a full disk are invisible to it. The report says 'not writable' only when the mode bits are unambiguous. Attempting a write is the accurate test and is exactly what the read-only contract forbids.",
]

