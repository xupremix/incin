deliverable = "Typed meshes and ValidMesh; valid and invalid world-size compile tests"
evidence = ["cargo test -p incin-core --features distributed --test mesh_compile"]
completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin-core --features distributed --test mesh_compile -> 8 passed, 0 failed, of which 3 are trybuild compile-fail cases. incin_core::dist::mesh is the compile-time half of sec. 3.8 and none of the runtime half. Sec. 3.8 splits distributed correctness into a logical proof domain -- shard counts, placements, collective semantics, global and local shapes -- and a physical one -- installed devices, rank mapping, memory, peer access, link topology, transport versions -- and is explicit that the API 'must call this compile-time logical device selection and validation, never compile-time hardware existence validation'. So a MeshSpec holds no DeviceId: it says how many ranks the topology has along the data, tensor, and pipeline axes and nothing about which devices they are. DeviceMesh, MeshId, CollectiveGroups and TopologyFingerprint are DST-002's Appendix A row and are not built here; a mesh type carrying devices would be making the physical claim while checking the logical one. ValidMesh is implemented for exactly one shape of type -- three correctly ordered axis markers over nonzero typenum degrees -- so every way of being an invalid topology is the absence of an implementation rather than a check something has to remember to call. Sec. 3.8 asks for 'nonzero axes and checked DP x TP x PP multiplication on stable Rust': both are bounds, NonZero being typenum's own marker (not implemented for UTerm) and the product being the same Mul the shape rules use, so a mesh and a shape agree about multiplication by construction rather than by review. World is an associated type and not only a constant, which is what turns sec. 3.8's sentence about three GPUs -- 'valid examples are DP=3, TP=3, or PP=3. A rectangular 2 x 2 mesh is not valid and must not be partially populated implicitly' -- into a M: ValidMesh<World = U3> bound and a compile error for the 2 x 2 (D-054). WORLD stays a defaulted projection of World so no implementation can set the two independently; a mesh that reports a world size other than its own binds the wrong number of devices. The axes being positional is the third compile-fail case and the one worth having: Data<U1> x Pipeline<U3> x TensorParallel<U1> is three ranks either way, and swapping the markers turns three-way tensor parallelism into three pipeline stages with nothing downstream noticing (D-055). Omitted axes default to one, matching the mesh![dp = 3] form UX-002 will expand to. The mesh cases needed their own trybuild directory: a preview row ships behind a non-default feature per Appendix B, and a case in tests/compile_fail/ is built without it, so it would fail with E0433 -- one of the five scaffolding failures SHP-007 added its registry check to catch. Two directories are not two properties, so the 'say what this case proves' check moved to tests/support/ and both suites call it (D-057). The mesh types stay out of the prelude and the incin facade gains no distributed feature: Data and Pipeline are ordinary enough words that a glob prelude re-exporting them changes what use incin::prelude::* means the day a preview feature is enabled, and nothing in the facade accepts a mesh until DST-002 and DST-003, so forwarding it would expose a type with no verbs at the price of doubling incin's feature-powerset job (D-056). CI gained a step running the preview-tier evidence commands for UX-001 and DST-001, because the powerset job runs cargo hack check and so compiles those suites without executing them, and the default test job does not enable their features at all -- trybuild cases in particular assert nothing under check (D-058). The doctest step names incin-core/distributed for the same reason UX-013 added it: a cfg-gated module's examples are excluded from a default doc run. Five mutants, all caught. Allowing a zero axis failed the trybuild case. Reporting the pipeline degree as the tensor degree failed 2 tests. Adding a second impl for the swapped axis order failed the trybuild case. Defaulting the omitted axes to the wrong markers failed the whole suite to compile. The fifth -- dropping the pipeline axis from the product -- does not compile the library at all, because World is bounded Unsigned and Prod<DP, TP> is not known to be one: the bound rejects that mutation before any test runs. cargo test --workspace -> 1152 passed, 0 failed (the workspace run does not enable distributed, so the 8 mesh tests are the row's own command). cargo test --workspace --doc --features incin-core/distributed -> 79 passed, 0 ignored, up from 76: the three new examples are the module, MeshSpec, and ValidMesh. cargo clippy --workspace --all-targets -- -D warnings exits zero, and so does cargo clippy -p incin-core --features distributed --all-targets. cargo check -p incin-core --no-default-features --features distributed --all-targets builds, so the module is no_std. cargo fmt --all --check clean. cargo xtask ledger, budgets, docs --check and tools/audit-shapes.sh --check all ok."
deviations = [
  "ValidMesh exposes World as an associated type with WORLD as its defaulted projection, rather than a WORLD constant alone. Sec. 3.8 distinguishes valid three-GPU meshes from a rectangular 2 x 2, and a usize cannot be bounded on; M: ValidMesh<World = U3> is what makes that sentence a compile error.",
  "MeshSpec's axes are positional and each position accepts only its own marker, so ValidMesh has exactly one impl rather than a single MeshAxis bound on all three parameters. A shared bound accepts MeshSpec<Data<U1>, Pipeline<U3>, TensorParallel<U1>>, which has the same world size as the mesh it was meant to be and describes three pipeline stages instead of three-way tensor parallelism.",
  "The mesh types are not re-exported from incin_core::prelude and the incin facade gains no distributed feature. Data and Pipeline are ordinary enough words that a glob prelude re-exporting them changes what use incin::prelude::* means the day a preview feature is enabled, and nothing in the facade accepts a mesh until DST-002 and DST-003.",
  "The mesh compile-fail cases live in a second trybuild directory, crates/incin-core/tests/mesh_compile_fail/. tests/compile_fail/ is built without the distributed feature, so a mesh case there would fail with E0433, one of the five scaffolding failures SHP-007's registry check exists to catch. The registry itself moved to tests/support/ so two directories do not become two implementations of one property.",
  "The row's evidence command gained --features distributed, for the reason D-053 records for UX-001: a cfg-gated suite run without its feature reports ok having run nothing.",
  "CI gained a step running the preview-tier evidence commands for UX-001 and DST-001. The powerset job runs cargo hack check, which compiles those suites without executing them, and the default test job does not enable their features; trybuild cases assert nothing under check.",
  "MeshDegrees, a runtime struct projecting the three degrees, was not built. ValidMesh carries DATA, TENSOR and PIPELINE as consts instead. A struct nothing formats yet is a struct nothing reads, and DST-002 is where a bind report and a diagnostic will need one.",
]

[[task]]
id = "DST-002"
tier = "preview"
theme = "dist"
status = "complete"
deps = ["DST-001", "EXE-005"]
target = ["crates/incin-core/src/dist/mesh.rs"]
deliverable = "Physical binding, topology fingerprint, and runtime guards"
evidence = ["cargo test -p incin-core --features distributed --test mesh_bind"]
completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin-core --features distributed --test mesh_bind -> 17 passed, 0 failed. This is the physical half of sec. 2.11, in the same file as DST-001's logical half on purpose: the failure that section warns about is one type making the logical claim and the physical one at once, and the boundary is easier to hold with both sides on the screen. MeshSpec still holds no device; DeviceMesh<M> holds nothing but devices and can only be built by bind. Nothing in the row reads hardware. Every question binding asks a machine goes through TopologyProbe and every decision made from its answers is a pure function, which is why the suite binds sec. 2.11's own three-GPU example on a runner with no GPU and why all eight rejections are ordinary test cases (D-059). No implementor ships here -- a probe answering questions about CUDA link topology has to call CUDA and incin-core is no_std -- so DST-005 and DST-006 own the real ones. Two guards exist because sec. 2.11 says the ordinal is not an identity and they are not the same guard: RepeatedDevice catches the same number twice, AliasedDevice catches two different numbers a visibility mask has pointed at one card, which only the vendor-stable id can see. MixedArchitecture is the same argument one level down. The rank layout is data outermost, then pipeline, then tensor innermost, so tensor-parallel peers are contiguous: that axis exchanges activations every layer and launchers put consecutive ranks on one host, so the innermost axis lands on the fastest link. CollectiveGroups computes this over an axis array rather than three named degrees, so sec. 2.11's expert-parallel axis is an array entry later rather than a convention re-cut two rows on (D-061). Reachability is required within every collective group and only within them, and only Unreachable is refused, because a slow link is a performance judgement no library should make silently for a caller (D-062). MeshId folds the fingerprint digest with the logical degrees and the suite contains the case proving both halves are needed: DP=6 and TP=6 over six fully-connected devices probe the same pairs in the same order, so their fingerprints are byte-identical, and they are incompatible programs. The digest is a hand-rolled FNV-1a because it must be identical in two processes that never speak -- ahash is seeded per process and DefaultHasher is documented unstable across releases (D-063). BindError is a standalone enum rather than variants on a core error type, because it exists only under the distributed feature and a core enum whose variant set depends on a feature cannot be matched on portably (D-060). Eleven mutants, all caught. Each of the eight guards defeated in turn failed its own named test. Dropping the degrees from MeshId failed the DP=6/TP=6 case. Removing the digest's per-field length prefix failed the case distinguishing 'GPU-1'+'sm_90' from 'GPU-'+'1sm_90', a test written only after a first mutation run showed nothing covered it. Reversing the axis order failed the adjacency test; the round-trip test alone stays self-consistent under that mutation and would not have caught it. Recording links in one direction only failed the fingerprint link-count test. One mutation was rejected as unfaithful rather than recorded as a survivor: zeroing M::DATA alone leaves MeshId unchanged in every reachable case, because two meshes differing only in their data degree have different world sizes and cannot bind the same devices. What the row does not do is the rest of sec. 2.11's binding list: backend/dtype capabilities need a CapabilityRegistry per rank (DST-005/DST-006), estimated peak memory needs a plan to estimate (DST-007), and communicator health cannot be answered by inspection because a communicator has to exist first (DST-006). EXE-005 is a dependency because binding will consult the registry through its Capabilities trait, not because this row consults it. Placements remain DST-003, mesh![...] remains UX-002, and the incin facade still gains no distributed feature. cargo test --workspace -> 96 suites, 0 failed (the workspace run does not enable distributed, so the 17 bind tests are the row's own command). cargo test --workspace --doc --features incin-core/distributed passes. cargo clippy --workspace --all-targets -- -D warnings exits zero with no warnings. cargo fmt --check clean. cargo check -p incin-core --no-default-features --features distributed --all-targets builds, so the module is still no_std -- it uses alloc for the fingerprint's Vec and String and nothing else. cargo doc -p incin-core --features distributed --no-deps has no warning in dist/mesh.rs. CI's preview-feature step runs the row's command verbatim beside DST-001's. cargo xtask ledger, budgets, docs --check Adding MeshAxis re-blessed two of DST-001's trybuild baselines: its Data and Pipeline variants shadow the marker type names, so rustc fully qualifies them now and that diagnostic is longer (D-064). The error codes and the registry guard are unchanged. and tools/audit-shapes.sh --check all ok."
deviations = [
  "DeviceMesh::bind reads a TopologyProbe trait rather than any ambient hardware. Sec. 2.11's physical proof is about installed devices, link topology and process layout, and a suite that could only run where those happen to be right would exercise no rejection at all. This is UX-014's Host seam for the same reason: tests/mesh_bind.rs binds a three-GPU mesh on a runner with no GPU. No implementor ships in this row, because a probe answering questions about CUDA link topology has to call CUDA and incin-core is no_std; DST-005 and DST-006 own the real ones.",
  "BindError is a standalone enum in dist::mesh rather than variants on a core error type. It exists only under the distributed feature, and a core error enum whose variant set depends on a feature is one callers cannot match on portably. BackendError and BackwardError are the precedent for one enum per failure domain.",
  "The rank layout is fixed at data outermost, pipeline, tensor innermost, and CollectiveGroups computes it over an axis array rather than three named degrees. Tensor parallelism exchanges activations on every layer and launchers assign consecutive ranks to one host, so the innermost axis is the one that lands on the fastest link. Writing it over an array means sec. 2.11's expert-parallel axis is an array entry later rather than a re-cut convention.",
  "Reachability is required within every collective group and only within them, where the plan named only the tensor group. Two ranks sharing no group never run a collective together; two that share one cannot run the collective that axis is made of. Only Unreachable is refused, because a slow link is a performance judgement no library should make silently for a caller.",
  "The fingerprint digest is a hand-rolled FNV-1a with a length prefix before every field, rather than ahash (seeded per process) or DefaultHasher (documented unstable across releases). The digest has to be identical in two processes that never speak to each other, which is the whole point of computing a MeshId instead of agreeing on one. The length prefix keeps persistent='GPU-1', architecture='sm_90' distinct from persistent='GPU-', architecture='1sm_90'.",
  "DeviceMesh's Debug, Clone, PartialEq and Eq are written out rather than derived. derive would bound them on M: Debug + Clone + PartialEq + Eq, and M is a MeshSpec -- a marker that is never constructed and implements none of them -- so the bound would make a DeviceMesh undebuggable for exactly the type parameters it exists for.",
  "MeshAxis's variants are Data, Pipeline and Tensor, shadowing the marker type names, and DST-001's trybuild baselines were re-blessed to match. The typestate/projection pairing is the one Placement and PlacementKind already use, and an axis enum whose variants are not named after the axes reads worse at every call site. The cost is recorded rather than absorbed: rustc now fully qualifies incin_core::dist::mesh::Data in mesh_axes_out_of_order.stderr and mesh_zero_axis.stderr because the short name became ambiguous inside the module, so DST-001's headline diagnostic is longer than it was. What the cases assert is unchanged -- both still fail with E0277 and still pass every_mesh_case_names_the_rule_it_pins.",
]

