deliverable = "Structured backward and NaN failures; no expected-failure panic paths"
evidence = ["cargo test -p incin-core --test backward_errors"]
completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin-core --test backward_errors -> 11 passed, 0 failed. Both halves of PROPOSALS.md sec. 3.9 now hold. BackwardFn is Fn(&S) -> Result<Vec<S>>, and the count is what the sentence was about: an infallible signature gave a recipe exactly one way to report that it could not produce a gradient, and 115 sites across the three backends took it, as .expect(\"unbroadcast lhs (add)\") and .unwrap() on kernels that genuinely fail. All 92 recipes across cpu, wgpu and cuda return Ok and propagate with ?. Five of those unwraps were on an Option rather than a Result and could not become a bare ?, which is how they were found: four conv sites taking the single group of a groups==1 convolution and one embedding site indexing a trailing axis. They carry BackwardError::Recipe naming the operation and what was expected. NaN checking is an execution-policy axis. NanPolicy joins MathMode, Determinism, FallbackPolicy, AllocatorPolicy and GradMode on ExecutionPolicy, defaults to Permit, and check_gradients(|| ..) is the scope form. Backend::backward_with_nan_check is deleted along with its four implementations and the dispatch and tracing forwarders: with the check on the policy it was a second way to ask the same question, and it also decided to abort, so a caller who wanted the check without the abort had no spelling and one who wanted the abort had no reason to. The check is applied consistently rather than uniformly by accident. The core walk reads the policy once per pass, and so do the WGPU and CUDA walks that GRD-004 has yet to migrate. CUDA had no check at all before this -- its backward_with_nan_check delegated straight to backward -- so a CUDA user asking where a NaN came from was told nothing; it now reads its gradients back and answers. The same review found CUDA accumulating through and_modify, which cannot carry a failure, so its adding kernel unwrapped: a launch failure during backward aborted the process. It is an Entry match returning a Result now. The failure is a value and names its subject: BackwardError::NonFinite carries the tensor id and a NonFiniteSite distinguishing a recipe's own output from the sum of two contributions, because two finite values can sum to an infinity and a report that cannot tell them apart sends the reader to the wrong operation. Eleven cases: the default is Permit and is asserted to not run the check at all rather than merely not fail, the axis composes with the other five, a non-finite gradient returns an error naming the exact operand whose 1/0 gradient went bad, the message renders both the id and the site, catch_unwind proves nothing on the path panics, a checked pass over finite gradients returns the identical gradient values as an unchecked one, and a failed pass is proven to have drained the tape it walked. Three mutants were run against the finished suite. Ignoring the policy and never checking failed 4 tests; ignoring it and always checking failed the one that proves the default costs nothing; reporting a fixed tensor id instead of the real one failed the case that names the operand -- which is the assertion that started as a tautology and was rewritten when the first mutant survived it. cargo test --workspace -> 1027 passed, 0 failed. cargo test -p incin-backends --no-default-features --features std,cpu -> 341 passed, 0 failed, 2 ignored. cpu, cpu+wgpu, cpu+cuda and cpu+external-candle all check clean, and clippy --all-targets -- -D warnings exits zero for the workspace and for the cuda and wgpu feature sets. cargo fmt --all --check clean, cargo check -p incin-core --no-default-features clean, cargo xtask ledger and budgets ok, tools/audit-shapes.sh --check ok."
deviations = [
  "The row's target column names only crates/incin-core/src/exec/tape.rs. The signature is declared there and the walk reads the policy there, but a fallible recipe type is not a change one file can make: every recipe in all three backends implements it, the policy axis lives in exec/policy.rs beside the five it composes with, the error type in err.rs beside BackendError, and the deleted method in tensor/backend.rs plus its four implementations, the dispatch forwarder and the tracing one. A signature nothing satisfies is not a contract.",
  "Roughly twenty converted sites carried an expect message asserting the call could not fail -- 'shapes proven compatible', 'same element count' -- and those messages do not survive as comments. The claim they make is the one a fallible signature makes unnecessary: an error that cannot occur costs a ? and never fires, whereas asserting impossibility with a panic is the thing this row exists to remove. Where the message named which operand had failed, that information is in the returned ShapeError instead.",
  "WGPU and CUDA keep their own walks, so the policy read is written three times rather than once. GRD-004 owns migrating them onto the core node, on hardware this host does not have. Leaving their walks unchecked until then would have meant a policy that two of three backends ignore, which is the opposite of what sec. 3.9 asks for.",
  "The backward recipe type is fallible but still returns Vec<S> rather than one gradient per input as a checked structure, so a recipe returning the wrong number of gradients still silently truncates through zip. That is a separate defect from error typing and belongs with GRD-006, which is already changing what a node holds.",
  "Backend::backward_with_nan_check is removed rather than deprecated. It is a trait method, so an external backend author implementing it now fails to compile against a trait that no longer declares it; the repository is at 0.0.0 and REL-002 is the first row that owes anyone a migration note, which is where the removal is recorded.",
]

