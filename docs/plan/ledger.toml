[[task]]
id = "UX-013"
tier = "core"
theme = "ux"
status = "complete"
deps = ["GOV-005", "EXE-005", "UX-014"]
target = ["docs/", "README.md"]
deliverable = "Feature and capability documentation generated from tested registrations, with compiled examples"
evidence = ["cargo test --workspace --doc"]
completed_on = "2026-07-29"
completed_evidence = "cargo test --workspace --doc -> 75 passed, 0 failed, 0 ignored. The row has two halves because sec. 2.10 has two sentences. The first is a prohibition -- 'do not maintain independent handwritten support tables that can drift from code' -- so the row is done when the tables cannot drift, which is a different thing from their currently being right. They were not. The facade feature matrix listed candle, which GOV-006 renamed to external-candle and left only as a deprecated alias, four lines above an installation example using the new name, and it omitted cpu-blas and paranoid-validation altogether. The two halves have different authorities and therefore different generators. A feature's name, whether it is on by default and what it enables are facts about a Cargo manifest, so xtask/src/docs.rs reads the manifests and splices README.md between markers; the Purpose column comes from the # comment above each feature, which is the only prose description of a feature that already lives beside the declaration it describes, so there is one copy rather than two. What a backend supports is a Rust static, so crates/incin-backends/src/capability_docs.rs renders docs/capabilities.md from CPU_CAPABILITIES, CUDA_CAPABILITIES and WGPU_CAPABILITIES -- the registrations EXE-005 already tests -- and never parses anything. Putting both in xtask would have meant either parsing Rust or linking xtask against incin-backends, which makes cargo xtask ledger compile the whole backend stack to read a TOML file. Both have a check and both checks run in CI: cargo xtask docs --check fails on a stale README, and crates/incin-backends/tests/generated_docs.rs fails on a stale docs/capabilities.md. A generated file nobody regenerates has drifted exactly as far as a handwritten one and reads as authoritative while doing it. The summary table was a yes/no matrix in the first draft and it was eleven rows of 'yes': all three backends register the same eleven operations. That reads as parity when the backends are not at parity -- CPU registers reduction for f32 alone and CUDA registers it for every float -- so the cell carries the element-type union instead, which is the question a reader actually has. The second sentence is 'every public example is compiled in the minimum documented feature set', and it is what the evidence command measures. It was measuring almost nothing: 70 of the workspace's 79 examples were fenced rust,ignore, so cargo test --workspace --doc reported success having compiled nine. CI never ran it at all, because cargo test --all-targets excludes doctests -- that is how the count reached seventy with a green pipeline. The command is a CI step now. Compiling the examples found them documenting an API that does not exist. from_slice was shown with one argument and takes two, in fifteen places. Param was shown as Param<Tensor<S, B>> and is Param<S, B>. A rank-1 reshape's Arg was written () and is ((),). dims() was compared against a vec! where a static shape returns an array. The s! macro's own example advertised incin::symbolic_dim!, which does not resolve: symbolic_dim! is a #[doc(hidden)] alias for dim! in incin-core and the facade does not re-export it, so the README's named-dimensions bullet was advertising an unreachable name too. incin-data's front-page example was built on a DataLoader::new(dataset).batch_size(32).shuffle(true) builder against a constructor that takes three arguments. Four different placeholder names -- DefaultBackend, MyBackend, Backend, IncinBackend<f32, Cpu> -- named one concept and are all DefaultBackend now, which is the one a user can write. Three defects came out from under the examples rather than in them. IndexSpec is the argument type of the public Tensor::slice and was not reachable from the prelude, so the documented call could not be written by a user of it; the trybuild expectation that had to be regenerated is the proof, because rustc had been rendering the full incin::tensor::ops::index::IndexSpec path for want of a shorter one and now renders &[IndexSpec]. LSTM and LSTMCell were absent from the prelude while RNN and RNNCell one line above were present. And DummyBackend's four binary operations returned the left operand's shape unchanged, which disagrees with every real backend: broadcast_add and its siblings reach Backend::add with differently shaped operands and hand the result to Tensor::from_parts against the broadcast type, so the documented broadcast_add example failed with 'expected [2, 2], got [2, 1]'. incin_core::shapes::broadcast::broadcast_dim_slices is the one right-aligned rule both the typed path and the backend now use. Nothing had ever run a broadcast_* example, which is exactly why it survived. DTypeId::name, DeviceKind::name and ImplementationKind::name now live on the enums. cargo incin doctor carried private copies of the first two, and both needed a _ => 'unknown' arm because the enums are #[non_exhaustive] outside incin-core -- so a dtype added later would have rendered as the literal string 'unknown' in a support report. Inside incin-core the match is exhaustive and the same addition is a compile error. The doctor's 25 tests pass unchanged against the shared names, which is the check that the two spellings were identical. A third test in generated_docs.rs scans every crates/*/src file and fails on a reintroduced ```ignore fence. A snippet that genuinely cannot compile where it lives -- the invocation form of a pub(crate) macro, a model! that opens a file at build time -- is fenced ```text, which says it is shown rather than checked and, unlike ignore, does not claim to be a checked example. Reintroducing one ignore fence in unary.rs fails that test with the file and line. Nine mutants run. Against the capability renderer, all five caught and compiling: an unregistered operation rendered as supported failed 1, a second registration replacing the first rather than widening it failed 2, any-rank printed as the literal ceiling failed 2, the training flag inverted failed 1, and composed rendered as native failed 1. The first attempt at that first mutant survived, because the em-dash branch was unreachable while all three backends register the same operations -- summary() takes the device list as an argument now and three unit tests drive it from fixtures where the backends differ. Against the README generator, two of four survived the first pass and both were gaps in the tests rather than in the code: default_closure was covered but facade_table was not required to call it (the real facade's closure and direct default list coincide), and the missing-marker test did not distinguish which marker was missing, so a mutant defaulting a missing begin to offset zero still errored on the end lookup. Both closed with fixtures; all four caught after. cargo test --workspace -> 1146 passed, 0 failed, up from 1064. cargo test --workspace --doc -> 75 passed, 0 ignored, up from 9 passed and 70 ignored. cargo clippy --workspace --all-targets -- -D warnings exits zero, cargo fmt --all --check clean. cargo test -p incin-backends --no-default-features --features std,cpu -> 356 passed; cargo test -p incin --no-default-features --features std -> 27 passed; cargo check -p incin-core --no-default-features clean. cargo xtask ledger, cargo xtask budgets, cargo xtask docs --check and tools/audit-shapes.sh --check all ok. The 128 unused_variables in the backend-less std,external-candle build are unchanged from HEAD and pre-existing; dispatch.rs is EXE-009's declared target."
deviations = [
  "The two generated documents have two generators. cargo xtask docs renders README.md's feature tables from the Cargo manifests; incin_backends::capability_docs renders docs/capabilities.md from the capability statics. One generator in xtask would have had to either parse Rust or link xtask against incin-backends, which makes cargo xtask ledger -- run constantly -- compile the whole backend stack to read a TOML file. A generator belongs with its authority.",
  "The README's Purpose column is generated from the # comment above each feature in Cargo.toml rather than written in the README. That comment already exists and already sits beside the declaration it describes; a table written separately is the drift sec. 2.10 prohibits, in the same file that prohibits it.",
  "The capability summary cell is the element-type union rather than a support tick. All three backends register the same eleven operations, so a yes/no matrix renders as eleven rows of 'yes' and reads as parity, while CPU registers reduction for f32 alone and CUDA registers it for every float.",
  "An example that cannot compile where it lives is fenced ```text and a test fails on any ```ignore fence under crates/*/src. Leaving ignore for the handful of genuine cases makes the rule unenforceable, because ignore is indistinguishable from 'we did not get round to it' -- which is how seventy of them accumulated.",
  "incin-core's examples satisfy their backend parameter with a hidden DummyBackend alias rather than the facade's DefaultBackend. A dev-dependency cycle from incin-core on incin compiles, and incin-macros already has one, but it would put the facade in incin-core's dev graph under cargo hack check --feature-powerset --all-targets, where feature unification would enable incin-core/std and silently stop the no_std powerset check from checking no_std. The visible text of an example documents the API; which concrete type satisfies B does not.",
  "DTypeId::name, DeviceKind::name and ImplementationKind::name were added to incin-core rather than left as the doctor's private copies. Those copies needed a _ => 'unknown' arm because the enums are #[non_exhaustive] outside the defining crate, so a dtype added later would have rendered as the literal string 'unknown' in a support report; inside incin-core the match is exhaustive and the same addition is a compile error.",
  "IndexSpec, LSTM and LSTMCell were added to incin-core's prelude. This is a public API change in a documentation row, and the alternative was to document Tensor::slice with a path a prelude user cannot reach -- which documents an ergonomics defect instead of fixing it.",
  "broadcast_dim_slices was made public and DummyBackend's binary ops routed through it. The stand-in's own module doc says it tracks how an operation would transform the shape using the same arithmetic real backends use, and returning the left shape unchanged is not that.",
]

