  "Q8_0 does not implement CollectiveDType. Its block encoding makes an element count insufficient to derive a byte count without an additional block/layout contract, so accepting it through the scalar collective interface would violate the checked-count requirement. Dyn rejects Q8_0 at runtime for the same reason.",
  "ReferenceTopology can describe CUDA DeviceIds and Network links even though ReferenceTransport moves host values. It is a deterministic TopologyProbe fixture for physical binding, not a claim that the reference transport moves CUDA memory.",
