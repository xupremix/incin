[[task]]
id = "GRD-001"
tier = "core"
theme = "grad"
status = "complete"
deps = ["EXE-006"]
target = ["crates/incin-core/src/exec/context.rs"]
deliverable = "Explicit ExecutionContext with nested and concurrent tests"
evidence = ["cargo test -p incin-core --test exec_context"]
completed_on = "2026-07-28"
completed_evidence = "cargo test -p incin-core --test exec_context -> 9 passed, 0 failed. ExecutionContext now carries an ExecutionPolicy beside its backend, with with_math_mode, with_determinism, with_fallback and with_allocator builders and matching accessors. exec::policy gains Determinism, FallbackPolicy and AllocatorPolicy beside the MathMode that was already there, and ExecutionPolicy grouping all four. The defaults are asserted rather than assumed: precise arithmetic, no determinism promise, FallbackPolicy::Deny, and a direct allocator, so a context nobody configured cannot copy to the host behind the caller's back. Determinism is the split half of the promoted KernelMathMode that D-008 requires and that policy.rs already documented as pending. FallbackPolicy is ordered rather than boolean, and allows_composition and allows_transfer are tested in both directions so AllowTransfer implying AllowComposition is a fact rather than a convention. ExecutionPolicy::scope installs a per-thread ambient default for the eager convenience form, restoring through a Drop guard rather than at the end of the call. Three tests cover what a scope could leak. Nesting goes three deep and asserts each exit restores its enclosing scope rather than the default; the same test was re-run against a mutant whose guard restored the default instead, and it failed, as did the panic test. The panic test unwinds out of an inner scope through catch_unwind and asserts the enclosing policy survived. The concurrency test spawns four workers, each with a different single axis moved, rendezvouses so that all four are inside their own scope simultaneously rather than in sequence, asserts the spawning thread still sees the default while they are, and then asserts each worker read back exactly its own policy. cargo check -p incin-core --no-default-features still passes, since the scope is std-only and the context is not."
deviations = [
  "PROPOSALS.md sec. 1.2.5 declares the policy fields flat on ExecutionContext. They are grouped into an ExecutionPolicy value instead, and the section has been updated to match. The reason is the scoped default the same section asks for: a thread-local cannot be generic over the backend type parameter, so the ambient value a scope installs has to be the part of a context that names no backend. Grouping produces exactly that part. The flat spelling survives as builders and accessors on the context, so context.with_determinism(..) and context.determinism() read as declared.",
  "Two of the six fields the section lists are absent. GradMode is attributed to GRD-002 by the type table in Appendix A, which owns deriving it from the existing Grad and NoGrad markers, and AutotunePolicy is attributed to TUN-003 and lives in incin-backends rather than here. Declaring either early would have meant a field a caller can set that nothing reads, which is a worse contract than a missing one. Both extend this same type rather than introducing a parallel context, and the module says so at the declaration.",
  "Determinism and FallbackPolicy are vocabulary and defaults, not yet enforcement. Nothing filters a kernel on Determinism::Required or refuses a transfer under FallbackPolicy::Deny today, because the capability registry has no per-kernel determinism claim and CapabilityRule would need one for every advertised row. Adding that claim here would mean asserting a determinism property for thirteen CUDA rows, the WGPU rows and the CPU rows without having analyzed a single kernel's accumulation order, which is precisely the false capability claim EXE-005's audit existed to remove. The registry change belongs with a row that can measure what it asserts.",
]

[[task]]
id = "GRD-002"
tier = "core"
theme = "grad"
status = "complete"
deps = ["GRD-001"]
target = ["crates/incin-core/src/exec/context.rs", "crates/incin-core/src/tensor/grad.rs"]
deliverable = "G to GradMode propagation; NoGrad records zero nodes and saves nothing"
evidence = ["cargo test -p incin-core --test nograd_records_nothing"]
completed_on = "2026-07-29"
completed_evidence = "cargo test -p incin-core --test nograd_records_nothing -> 17 passed, 0 failed. exec::policy gains GradMode, the field GRD-001 left out of ExecutionPolicy on the grounds that a field nothing reads is worse than a missing one; something reads it now. RequiresGrad::grad_mode derives it from requires_grad as a default trait body rather than taking it per impl, so Grad, NoGrad and Dyn cannot claim one thing about gradients and another about recording -- the test asserts the two agree for every marker, which is what turns a future override into a failure instead of a tensor that tracks nothing quietly. The carrier is the ambient ExecutionPolicy GRD-001 already installs, not a second thread-local: two ambient mechanisms restore independently, and a panic unwinding through both would have to leave them consistent by coincidence. GradMode::restrict and GradMode::scope are deliberately different operations. restrict combines with the ambient mode and can only tighten, which is what an operand's marker does; scope installs, which is what a caller does. Without the split, a no_grad block would be undone by the first Grad tensor inside it. Tensor::under_grad_mode is the propagation point, applied at every frontend site that reaches a backend method producing a successor tensor: the binary, unary and reduction macros, and the explicit sites in manipulation.rs, loss.rs, module.rs, matmul.rs and conv2d.rs. Grad installs nothing and reads no thread-local at all, so the common path costs zero. The mode is taken from the result's marker rather than the receiver's, which differs only for argmax, argmin, topk and argsort -- they return NoGrad whatever they were called on, and they now run under Disabled unconditionally. The three backend tapes gate push on GradMode::current().records(). One gate per tape rather than one per call site: there are 116 push sites, and a guarantee that depends on 116 correct edits is not a guarantee. cpu::tape::len was #[cfg(test)] and is now pub fn depth, re-exported as cpu::tape_depth, because the row's claim is about what an outside observer can count. Every recording assertion is a delta over that count around a four-operation chain spanning four operation families -- a gate installed on one family and forgotten on another passes a one-op test. The Grad chain is asserted nonzero before the NoGrad chain is asserted zero, since zero against zero proves nothing. Three mutants were run against the finished suite and all three failed it: removing the push gate failed 4 tests including the Dyn and index-reduction cases; making restrict install unconditionally instead of only tightening failed both the no_grad-over-a-Grad-chain test and the tightening test; and propagating the receiver's marker instead of the result's into argmax, argmin, topk and argsort failed the index-reduction test, which also confirms those kernels do record. The forward numbers are asserted identical across all three spellings -- eager Grad, NoGrad operands, and a no_grad scope -- against a gate that skips the kernel rather than the recording; and one SGD step through Linear is asserted to reduce the loss, against a gate that is too eager and silences the ordinary training path. cargo test --workspace -> 1006 passed, 0 failed. cargo test -p incin-backends --no-default-features --features std,cpu -> 331 passed, 0 failed, 2 ignored. cargo clippy --workspace --all-targets -- -D warnings exits zero, cargo fmt --all --check is clean, and cargo check -p incin-core --no-default-features still builds, since restrict is a no-op without std and every tape in the workspace requires std anyway. cargo xtask ledger and cargo xtask budgets ok."
deviations = [
  "The row's target column names exec/context.rs and tensor/grad.rs. Both changed, and neither could carry the row alone: GradMode is declared in exec/policy.rs beside the four axes it composes with, the propagation lives at the frontend operation sites in tensor/base.rs, tensor/ops/{binary,unary,reduce,manipulation,loss,module}.rs, tensor/matmul.rs and tensor/conv2d.rs, and the gate that makes any of it observable is in the three backend tapes. A GradMode that context.rs can set and no kernel consults would satisfy the target list and none of the deliverable.",
  "'Saves nothing' is discharged at the push boundary, not at the capture. A CPU backward closure clones its saved operands into the TapeEntry immediately before pushing it, so a refused push drops those clones at once and retains nothing -- but it does not prevent the clone. CpuStorage is Rc-backed, so what is skipped is a refcount bump rather than a buffer copy. Never building the entry means building it lazily at all 116 call sites, against a TapeEntry type GRD-003 is about to replace with a backend-neutral one. It belongs there.",
  "cpu::tape::len was #[cfg(test)] pub(crate) and is now an unconditional pub fn depth, re-exported from cpu, wgpu and cuda as tape_depth. This is an addition to the public API that the RFC does not list. The alternative was an evidence test that infers 'nothing was recorded' from a backward pass finding no gradients, which passes equally well against a tape that recorded entries nothing happened to reach. A guarantee nothing outside the crate can observe is not a guarantee.",
  "Tensor::argmax and Tensor::argmin cannot succeed on the CPU backend, and this row does not fix them. The frontend types the result u32 while the kernel fills an I64 buffer, so from_parts rejects the storage its own backend just produced; the backend unit tests call B::argmax::<f32, i64> directly and so never crossed the frontend that names the dtype. The kernel still runs before that check, which is what keeps the recording assertion over those two meaningful rather than vacuous, and the test asserts is_err explicitly so it fails loudly once the defect is fixed. topk and argsort use u32 end to end and are asserted normally.",
  "EXE-009 remains [~] alongside this row rather than this being the only active one. Its remainder is the 287-method legacy Backend surface, which needs the direct kernel work PRF-003 owns, and PRF-003 needs CUDA hardware. Parking it and taking the next unblocked core row is the alternative to leaving the grad track idle behind a hardware dependency.",
]

