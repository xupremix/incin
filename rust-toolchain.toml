[toolchain]
# Pin the supported compiler because trybuild fixtures record rustc diagnostic
# text. Upgrade this deliberately, then refresh snapshots after reviewing the
# resulting diagnostics.
channel = "1.97.1"
# channel = "nightly"
# rustfmt and clippy are named here so the gate exists wherever the toolchain
# does. Omitting them is what produced a repository whose CI could not run
# cargo fmt and whose ledger recorded clippy as unavailable across several rows.
components = ["rust-src", "rustfmt", "clippy"]
