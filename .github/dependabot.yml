version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:release
      - type:maintenance

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:editor
      - type:maintenance
    ignore:
      # @types/vscode is not a dependency to keep current: it declares the
      # oldest VS Code whose API the extension is allowed to reach for, and
      # vsce refuses to package when it runs ahead of engines.vscode. Bumping
      # it either breaks packaging or silently narrows who can install the
      # extension, so the floor moves by hand when the extension needs a newer
      # API, together with engines.vscode.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - area:release
      - type:maintenance
