# Scheduled hardware matrix (CI-002).
#
# `ci.yml` proves the CUDA backend compiles and runs WGPU against whatever
# adapter a GitHub-hosted runner provides. Neither is a hardware claim. This
# workflow runs the suites that need a real device, including the `--ignored`
# tests that stay ignored precisely so `cargo test` passes on a machine without
# one.
#
# A GitHub-hosted runner has no NVIDIA device, so the CUDA jobs need a
# self-hosted runner. Naming a label that no runner carries makes a job queue
# until it times out, which reads as "still running" for hours and then as a
# failure that has nothing to do with the code. The `select` job therefore
# resolves runner availability from the `HARDWARE_CUDA_RUNNER` and
# `HARDWARE_WGPU_RUNNER` repository variables first, and states what it skipped
# and why.
#
# Two follow-ons keep a skip from reading as a pass. Each hardware job that
# executes uploads its own `hardware-<job>-<attempt>` artifact: a dated result
# record plus the suite log, so a capability claim cites a run instead of a
# configuration. The final `conclusion` job then fails the run whenever a
# requested suite was skipped for want of a runner variable: GitHub cannot
# give a run whose other jobs executed a `skipped` or `neutral` conclusion,
# so the coverage verdict ("skipped, not success") is carried by that job's
# annotation and step summary, and a green run always means the suites in it
# really ran.
name: Hardware Matrix

on:
  schedule:
    # Weekly, Monday 05:00 UTC. Hardware obligations are regression checks on
    # code that already passed review, not a pre-merge gate.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which hardware job to run: all, cuda, wgpu, metal'
        required: false
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  select:
    name: Resolve Hardware Availability
    runs-on: ubuntu-latest
    outputs:
      cuda: ${{ steps.resolve.outputs.cuda }}
      cuda_runner: ${{ steps.resolve.outputs.cuda_runner }}
      wgpu_software: ${{ steps.resolve.outputs.wgpu_software }}
      wgpu_native: ${{ steps.resolve.outputs.wgpu_native }}
      wgpu_runner: ${{ steps.resolve.outputs.wgpu_runner }}
      metal: ${{ steps.resolve.outputs.metal }}
      metal_runner: ${{ steps.resolve.outputs.metal_runner }}
      dist2_network: ${{ steps.resolve.outputs.dist2_network }}
      multinode: ${{ steps.resolve.outputs.multinode }}
      coverage_skipped: ${{ steps.resolve.outputs.coverage_skipped }}
      skipped_jobs: ${{ steps.resolve.outputs.skipped_jobs }}
    steps:
      - name: Resolve requested jobs against registered runners
        id: resolve
        env:
          REQUESTED: ${{ github.event.inputs.job || 'all' }}
          CUDA_RUNNER: ${{ vars.HARDWARE_CUDA_RUNNER }}
          WGPU_RUNNER: ${{ vars.HARDWARE_WGPU_RUNNER }}
          METAL_RUNNER: ${{ vars.HARDWARE_METAL_RUNNER }}
        run: |
          set -euo pipefail

          # Job names owned by rows that have not landed. Accepting them
          # silently would report a green run for a matrix that does not exist.
          case "$REQUESTED" in
            all|cuda|wgpu|metal|dist2-network|multinode) ;;
            *)
              echo "::error::unknown job '$REQUESTED'; expected all, cuda, wgpu, metal, dist2-network, or multinode"
              exit 1 ;;
          esac

          cuda=false
          wgpu_software=false
          wgpu_native=false
          metal=false
          dist2_network=false
          multinode=false
          if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "cuda" ]; then cuda=true; fi
          if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "wgpu" ]; then
            wgpu_software=true
            wgpu_native=true
          fi
          if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "metal" ]; then metal=true; fi
          if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "dist2-network" ]; then dist2_network=true; fi
          if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "multinode" ]; then multinode=true; fi

          # A runner variable holds a JSON array of labels, e.g.
          # ["self-hosted","linux","cuda"]. Unset means no such runner is
          # registered, which is the repository's current state. Every suite
          # disabled below is recorded in skipped_jobs, because a run that
          # skipped a requested suite must conclude "skipped, not success"
          # rather than green; the conclusion job turns that list into the
          # run-level verdict.
          skipped_jobs=""
          if [ -z "${CUDA_RUNNER:-}" ]; then
            if [ "$REQUESTED" = "cuda" ] || [ "$REQUESTED" = "dist2-network" ] || [ "$REQUESTED" = "multinode" ]; then
              echo "::error::job=$REQUESTED was requested but the HARDWARE_CUDA_RUNNER variable is unset, so no GPU runner is registered"
              exit 1
            fi
            if [ "$cuda" = "true" ]; then skipped_jobs="cuda"; fi
            cuda=false
            # The collective jobs inherit the CUDA runner: without one they
            # would schedule onto the GPU-less ubuntu-latest fallback and run
            # NCCL with no device and no second rank. Skip them too, loudly,
            # so a skipped run can never masquerade as a passing one.
            if [ "$dist2_network" = "true" ] || [ "$multinode" = "true" ]; then
              echo "::warning::CUDA collective jobs skipped alongside the CUDA hardware job: HARDWARE_CUDA_RUNNER is unset, so there is no GPU and no second rank to run them on"
            fi
            if [ "$dist2_network" = "true" ]; then skipped_jobs="$skipped_jobs${skipped_jobs:+, }dist2-network"; fi
            if [ "$multinode" = "true" ]; then skipped_jobs="$skipped_jobs${skipped_jobs:+, }multinode"; fi
            dist2_network=false
            multinode=false
          fi
          if [ -z "${WGPU_RUNNER:-}" ]; then
            if [ "$wgpu_native" = "true" ]; then skipped_jobs="$skipped_jobs${skipped_jobs:+, }wgpu-native"; fi
            wgpu_native=false
            echo "::notice::WGPU native-adapter job skipped: HARDWARE_WGPU_RUNNER is unset. The software-adapter job still runs."
          fi

          coverage_skipped=false
          if [ -n "$skipped_jobs" ]; then coverage_skipped=true; fi

          {
            echo "cuda=$cuda"
            echo "cuda_runner=${CUDA_RUNNER:-[\"ubuntu-latest\"]}"
            echo "wgpu_software=$wgpu_software"
            echo "wgpu_native=$wgpu_native"
            echo "wgpu_runner=${WGPU_RUNNER:-[\"ubuntu-latest\"]}"
            echo "metal=$metal"
            echo "metal_runner=${METAL_RUNNER:-[\"macos-latest\"]}"
            echo "dist2_network=$dist2_network"
            echo "multinode=$multinode"
            echo "coverage_skipped=$coverage_skipped"
            echo "skipped_jobs=$skipped_jobs"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize what this run covers
        run: |
          {
            echo "## Hardware matrix selection"
            echo ""
            echo "| Job | Runs | Reason |"
            echo "|---|---|---|"
            echo "| cuda | ${{ steps.resolve.outputs.cuda }} | HARDWARE_CUDA_RUNNER ${{ vars.HARDWARE_CUDA_RUNNER && 'set' || 'unset' }} |"
            echo "| wgpu-software | ${{ steps.resolve.outputs.wgpu_software }} | GitHub-hosted lavapipe |"
            echo "| wgpu-native | ${{ steps.resolve.outputs.wgpu_native }} | HARDWARE_WGPU_RUNNER ${{ vars.HARDWARE_WGPU_RUNNER && 'set' || 'unset' }} |"
            echo "| metal | ${{ steps.resolve.outputs.metal }} | HARDWARE_METAL_RUNNER ${{ vars.HARDWARE_METAL_RUNNER && 'set' || 'unset' }} |"
            echo "| dist2-network | ${{ steps.resolve.outputs.dist2_network }} | CI-003 2-rank CUDA network matrix |"
            echo "| multinode | ${{ steps.resolve.outputs.multinode }} | CI-004 multi-process rendezvous & reshard |"
          } >> "$GITHUB_STEP_SUMMARY"

  cuda:
    name: CUDA Hardware Suite
    needs: select
    if: needs.select.outputs.cuda == 'true'
    runs-on: ${{ fromJSON(needs.select.outputs.cuda_runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A self-hosted runner keeps its state between runs, so the toolchain is
      # installed explicitly rather than assuming whatever the last job left
      # behind. rust-toolchain.toml pins 1.97.1, so this matches it.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Record device and driver
        run: |
          set -euo pipefail
          {
            echo "## CUDA environment"
            echo ""
            echo '```'
            nvidia-smi --query-gpu=name,driver_version,memory.total,compute_cap \
              --format=csv,noheader
            nvcc --version | tail -2
            echo '```'
          } | tee -a hardware-cuda.log >> "$GITHUB_STEP_SUMMARY"

      # `cargo test` runs the suite that passes anywhere; the `--ignored` run is
      # the one this workflow exists for. Both are recorded so a device-specific
      # failure is distinguishable from a general one.
      - name: CUDA suite, default tests
        run: |
          set -euo pipefail
          cargo test -p incin-backends --no-default-features --features std,cpu,cuda 2>&1 | tee -a hardware-cuda.log

      - name: CUDA suite, hardware tests
        run: |
          set -euo pipefail
          cargo test -p incin-backends --no-default-features --features std,cpu,cuda \
            -- --ignored 2>&1 | tee hardware.log
          # A run with no device present reports "0 passed" and exits zero, which
          # is indistinguishable from a pass by exit code alone. EXE-004,
          # EXE-005, and EXE-008 were discharged by this suite, so require that
          # it still executes rather than evaporates.
          #
          # The expected count is derived from the `#[ignore]` reasons in the
          # tree rather than written here: a literal floor does not track the
          # suite, and the previous one (60, against 65 actual) had room for a
          # whole suite to disappear inside it.
          cargo run -q -p xtask -- hardware-tests hardware.log

      - name: Storage metadata against real device pointers
        run: |
          set -euo pipefail
          cargo test -p incin-backends --features cuda --test tensor_meta -- --ignored 2>&1 | tee -a hardware-cuda.log

      # The artifact is the citable per-job execution result: a dated record
      # (what ran, where, with which runner variable, and how it concluded)
      # plus every suite log. if: always() so a red suite still publishes
      # what failed. hardware.log stays the ignored-suite log the xtask gate
      # counts; hardware-cuda.log carries the environment record and the two
      # surrounding suites.
      - name: Record CUDA job result
        if: always()
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.job || 'all' }}
          CUDA_RUNNER_STATE: ${{ vars.HARDWARE_CUDA_RUNNER && 'set' || 'unset' }}
        run: |
          set -euo pipefail
          {
            echo "# CUDA hardware suite result"
            echo ""
            echo "- Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }} (${{ github.event_name }})"
            echo "- Requested suite: $REQUESTED_SUITE"
            echo "- Runner: ${{ runner.os }}-${{ runner.arch }}"
            echo "- HARDWARE_CUDA_RUNNER: $CUDA_RUNNER_STATE"
            echo "- Conclusion: ${{ job.status }}"
          } > result-cuda.md

      - name: Upload CUDA hardware results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-${{ github.job }}-${{ github.run_attempt }}
          path: |
            result-cuda.md
            hardware-cuda.log
            hardware.log
          if-no-files-found: warn

  wgpu-software:
    name: WGPU Software Adapter
    needs: select
    if: needs.select.outputs.wgpu_software == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Install WGPU system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

      - name: Record adapter
        run: |
          {
            echo "## WGPU software adapter"
            echo ""
            echo '```'
            vulkaninfo --summary 2>/dev/null | head -40 || echo "vulkaninfo unavailable"
            echo '```'
          } | tee -a hardware-wgpu-software.log >> "$GITHUB_STEP_SUMMARY"

      - name: WGPU suite with CPU parity
        run: |
          set -euo pipefail
          cargo test -p incin-backends --all-targets --no-default-features --features std,cpu,wgpu 2>&1 | tee -a hardware-wgpu-software.log

      - name: Record WGPU software adapter job result
        if: always()
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.job || 'all' }}
        run: |
          set -euo pipefail
          {
            echo "# WGPU software adapter result (lavapipe)"
            echo ""
            echo "- Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }} (${{ github.event_name }})"
            echo "- Requested suite: $REQUESTED_SUITE"
            echo "- Runner: ${{ runner.os }}-${{ runner.arch }} (GitHub-hosted, software adapter)"
            echo "- Conclusion: ${{ job.status }}"
          } > result-wgpu-software.md

      - name: Upload WGPU software adapter results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-${{ github.job }}-${{ github.run_attempt }}
          path: |
            result-wgpu-software.md
            hardware-wgpu-software.log
          if-no-files-found: warn

  wgpu-native:
    name: WGPU Native Adapter
    needs: select
    if: needs.select.outputs.wgpu_native == 'true'
    runs-on: ${{ fromJSON(needs.select.outputs.wgpu_runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Record adapter
        run: |
          {
            echo "## WGPU native adapter"
            echo ""
            echo '```'
            vulkaninfo --summary 2>/dev/null | head -40 || echo "vulkaninfo unavailable"
            echo '```'
          } | tee -a hardware-wgpu-native.log >> "$GITHUB_STEP_SUMMARY"

      - name: WGPU suite with CPU parity
        run: |
          set -euo pipefail
          cargo test -p incin-backends --all-targets --no-default-features --features std,cpu,wgpu 2>&1 | tee -a hardware-wgpu-native.log

      - name: WGPU hardware tests
        run: |
          set -euo pipefail
          cargo test -p incin-backends --no-default-features --features std,cpu,wgpu -- --ignored 2>&1 | tee -a hardware-wgpu-native.log

      - name: Record WGPU native adapter job result
        if: always()
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.job || 'all' }}
          WGPU_RUNNER_STATE: ${{ vars.HARDWARE_WGPU_RUNNER && 'set' || 'unset' }}
        run: |
          set -euo pipefail
          {
            echo "# WGPU native adapter result"
            echo ""
            echo "- Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }} (${{ github.event_name }})"
            echo "- Requested suite: $REQUESTED_SUITE"
            echo "- Runner: ${{ runner.os }}-${{ runner.arch }}"
            echo "- HARDWARE_WGPU_RUNNER: $WGPU_RUNNER_STATE"
            echo "- Conclusion: ${{ job.status }}"
          } > result-wgpu-native.md

      - name: Upload WGPU native adapter results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-${{ github.job }}-${{ github.run_attempt }}
          path: |
            result-wgpu-native.md
            hardware-wgpu-native.log
          if-no-files-found: warn

  metal:
    name: Metal Hardware Suite (Apple Silicon)
    needs: select
    if: needs.select.outputs.metal == 'true'
    runs-on: ${{ fromJSON(needs.select.outputs.metal_runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Record Metal system details
        run: |
          set -euo pipefail
          {
            echo "## Metal environment"
            echo ""
            echo '```'
            system_profiler SPDisplaysDataType || echo "system_profiler unavailable"
            echo '```'
          } | tee -a hardware-metal.log >> "$GITHUB_STEP_SUMMARY"

      - name: Metal backend suite
        run: |
          set -euo pipefail
          cargo test -p incin-backends --no-default-features --features std,cpu,metal,metal-mps,autotune 2>&1 | tee -a hardware-metal.log

      - name: Metal autotuning integration tests
        run: |
          set -euo pipefail
          cargo test -p incin-backends --features metal,metal-mps,autotune --test metal_tuning 2>&1 | tee -a hardware-metal.log

      - name: Record Metal job result
        if: always()
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.job || 'all' }}
        run: |
          set -euo pipefail
          {
            echo "# Metal hardware suite result (Apple Silicon)"
            echo ""
            echo "- Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }} (${{ github.event_name }})"
            echo "- Requested suite: $REQUESTED_SUITE"
            echo "- Runner: ${{ runner.os }}-${{ runner.arch }} (GitHub-hosted Apple Silicon)"
            echo "- Conclusion: ${{ job.status }}"
          } > result-metal.md

      - name: Upload Metal hardware results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-${{ github.job }}-${{ github.run_attempt }}
          path: |
            result-metal.md
            hardware-metal.log
          if-no-files-found: warn

  dist2-network:
    name: Distributed 2-Rank Network Suite (CI-003)
    needs: select
    if: needs.select.outputs.dist2_network == 'true'
    runs-on: ${{ fromJSON(needs.select.outputs.cuda_runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Data Parallel (DP2) Networked Training Test
        run: |
          set -euo pipefail
          cargo test -p incin --features distributed-nccl,hardware-tests --test dp2_network 2>&1 | tee -a hardware-dist2-network.log

      - name: Tensor Parallel (TP2) Networked Linear/Attention Test
        run: |
          set -euo pipefail
          cargo test -p incin --features distributed-nccl,hardware-tests --test tp2_network 2>&1 | tee -a hardware-dist2-network.log

      - name: Pipeline Parallel (PP2) Networked Execution Test
        run: |
          set -euo pipefail
          cargo test -p incin --features distributed-nccl,hardware-tests --test pp2_network 2>&1 | tee -a hardware-dist2-network.log

      - name: Record distributed 2-rank job result
        if: always()
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.job || 'all' }}
          CUDA_RUNNER_STATE: ${{ vars.HARDWARE_CUDA_RUNNER && 'set' || 'unset' }}
        run: |
          set -euo pipefail
          {
            echo "# Distributed 2-rank network suite result (CI-003)"
            echo ""
            echo "- Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }} (${{ github.event_name }})"
            echo "- Requested suite: $REQUESTED_SUITE"
            echo "- Runner: ${{ runner.os }}-${{ runner.arch }}"
            echo "- HARDWARE_CUDA_RUNNER: $CUDA_RUNNER_STATE"
            echo "- Conclusion: ${{ job.status }}"
          } > result-dist2-network.md

      - name: Upload distributed 2-rank results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-${{ github.job }}-${{ github.run_attempt }}
          path: |
            result-dist2-network.md
            hardware-dist2-network.log
          if-no-files-found: warn

  multinode:
    name: Multi-Node & Rendezvous Suite (CI-004)
    needs: select
    if: needs.select.outputs.multinode == 'true'
    runs-on: ${{ fromJSON(needs.select.outputs.cuda_runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Multi-Process Rendezvous & Shutdown Test
        run: |
          set -euo pipefail
          cargo test -p incin --features distributed-nccl --test rendezvous 2>&1 | tee -a hardware-multinode.log

      - name: Global Checkpoint Manifest & Reshard Load Test
        run: |
          set -euo pipefail
          cargo test -p incin-core --test checkpoint_reshard 2>&1 | tee -a hardware-multinode.log

      - name: Record multinode job result
        if: always()
        env:
          REQUESTED_SUITE: ${{ github.event.inputs.job || 'all' }}
          CUDA_RUNNER_STATE: ${{ vars.HARDWARE_CUDA_RUNNER && 'set' || 'unset' }}
        run: |
          set -euo pipefail
          {
            echo "# Multi-node and rendezvous suite result (CI-004)"
            echo ""
            echo "- Date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }} (${{ github.event_name }})"
            echo "- Requested suite: $REQUESTED_SUITE"
            echo "- Runner: ${{ runner.os }}-${{ runner.arch }}"
            echo "- HARDWARE_CUDA_RUNNER: $CUDA_RUNNER_STATE"
            echo "- Conclusion: ${{ job.status }}"
          } > result-multinode.md

      - name: Upload multinode results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardware-${{ github.job }}-${{ github.run_attempt }}
          path: |
            result-multinode.md
            hardware-multinode.log
          if-no-files-found: warn

  # The run-level verdict. GitHub only offers success/failure/cancelled/skipped
  # as run conclusions, and a run where select, wgpu-software, and metal really
  # executed cannot conclude "skipped" no matter what the CUDA half did; the
  # removed exit-78 neutral path no longer exists either. So when a requested
  # suite was skipped for want of a HARDWARE_*_RUNNER variable this job fails,
  # and its annotation and step summary carry the coverage verdict verbatim:
  # skipped, not success. Needs every hardware job so the verdict sees the
  # whole matrix, and runs on a GitHub-hosted label so it can never queue on
  # the self-hosted runners it is judging.
  conclusion:
    name: Hardware Coverage Conclusion
    needs:
      - select
      - cuda
      - wgpu-software
      - wgpu-native
      - metal
      - dist2-network
      - multinode
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Conclude hardware coverage
        id: conclude
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          COVERAGE_SKIPPED: ${{ needs.select.outputs.coverage_skipped }}
          SKIPPED_JOBS: ${{ needs.select.outputs.skipped_jobs }}
          CUDA_RUNNER_STATE: ${{ vars.HARDWARE_CUDA_RUNNER && 'set' || 'unset' }}
          WGPU_RUNNER_STATE: ${{ vars.HARDWARE_WGPU_RUNNER && 'set' || 'unset' }}
        run: |
          set -euo pipefail

          # Fail closed: a resolver that did not finish has made no coverage
          # decision, and "no decision" must not read as a pass either.
          if [ "$SELECT_RESULT" != "success" ] || [ -z "$COVERAGE_SKIPPED" ]; then
            {
              echo "## Hardware coverage conclusion"
              echo ""
              echo "**Coverage conclusion: unknown** - the resolver did not complete (select: ${SELECT_RESULT:-missing}), so this run cannot be read as a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Hardware coverage unknown::the select job produced no coverage decision (result: ${SELECT_RESULT:-missing}); failing closed so an unresolved run cannot read as success"
            exit 1
          fi

          if [ "$COVERAGE_SKIPPED" = "true" ]; then
            {
              echo "## Hardware coverage conclusion"
