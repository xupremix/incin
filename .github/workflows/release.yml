name: Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.0'
        required: true
        type: string
      action:
        description: 'Build a new draft, or publish an existing verified draft'
        required: true
        default: build-draft
        type: choice
        options:
          - build-draft
          - publish-existing-draft

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.4.52
  NODE_VERSION: 22.14.0
  VSCE_VERSION: 3.6.0
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Fetch the release branch for ancestry validation
        run: git fetch --no-tags origin master:refs/remotes/origin/master

      - name: Validate the manual publication ref
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-existing-draft'
        env:
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$DISPATCH_REF_TYPE" != "tag" || "$DISPATCH_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Publish the draft by dispatching this workflow from the matching tag ref: $RELEASE_TAG" >&2
            exit 1
          fi

      - id: release
        name: Validate tag, checkout, and package versions
        run: python3 tools/release-preflight.py --tag "$RELEASE_TAG" --base-ref origin/master --github-output "$GITHUB_OUTPUT"

  book:
    name: Package book
    needs: preflight
    if: github.event_name == 'push' || inputs.action == 'build-draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install mdBook
        run: cargo install mdbook --version "${MDBOOK_VERSION}" --locked

      - name: Install Chromium for browser checks
        run: sudo apt-get update && sudo apt-get install -y chromium

      - name: Build and test book
        run: |
          set -euo pipefail
          mdbook build docs/book
          python3 docs/book/build_site.py
          python3 tools/check-book-site.py
          python3 tools/test-book-site.py
          python3 -m venv /tmp/incin-book-venv
          /tmp/incin-book-venv/bin/pip install --requirement docs/book/requirements.txt
          /tmp/incin-book-venv/bin/python docs/book/make_single_page.py

      - name: Archive book
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          tar -czf "incin-book-${version}.tar.gz" -C docs/book/book .
          cp docs/book/book/incin-book.html "incin-book-${version}.html"
          tar -czf "incin-book-site-${version}.tar.gz" -C docs/book/site .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-book
          path: incin-book-*
          if-no-files-found: error

  editors:
    name: Package editor integrations
    needs: preflight
    if: github.event_name == 'push' || inputs.action == 'build-draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test and package VS Code extension
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          xvfb-run -a npm test
          npx --yes "@vscode/vsce@${VSCE_VERSION}" package --out "incin-lsp-vscode-${{ needs.preflight.outputs.version }}.vsix"

      - name: Archive editor integrations
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          tar -czf "incin-lsp-nvim-${version}.tar.gz" -C editors/nvim README.md lua
          tar -czf "incin-rustrover-external-tool-${version}.tar.gz" -C editors/rustrover README.md incin-check.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-editors
          path: |
            editors/vscode/incin-lsp-vscode-*.vsix
            incin-lsp-nvim-*.tar.gz
            incin-rustrover-external-tool-*.tar.gz
          if-no-files-found: error

  rust-binaries:
    name: Build ${{ matrix.target }} binaries
    needs: preflight
    if: github.event_name == 'push' || inputs.action == 'build-draft'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-apple-darwin
            runs-on: macos-14
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      - name: Build LSP and Cargo subcommand
        run: |
          cargo build --locked --release -p incin-lsp --bin incin-lsp
          cargo build --locked --release -p incin --bin cargo-incin

      - name: Package Unix binaries
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          staging="incin-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp target/release/incin-lsp "$staging/"
          cp target/release/cargo-incin "$staging/"
          tar -czf "$staging.tar.gz" "$staging"

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          $staging = "incin-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item target/release/incin-lsp.exe $staging/
          Copy-Item target/release/cargo-incin.exe $staging/
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries-${{ matrix.target }}
          path: |
            incin-${{ needs.preflight.outputs.version }}-${{ matrix.target }}.tar.gz
            incin-${{ needs.preflight.outputs.version }}-${{ matrix.target }}.zip
          if-no-files-found: error

  verify-assets:
    name: Verify release asset set
    needs: [preflight, book, editors, rust-binaries]
    if: github.event_name == 'push' || inputs.action == 'build-draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify expected assets and generate checksums
        run: |
          set -euo pipefail
          python3 tools/release-assets.py manifest --version "${{ needs.preflight.outputs.version }}" --directory release-assets
          python3 tools/release-assets.py checksums --version "${{ needs.preflight.outputs.version }}" --directory release-assets
          python3 tools/release-assets.py verify --version "${{ needs.preflight.outputs.version }}" --directory release-assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verified-assets
          path: release-assets/
          if-no-files-found: error

  draft-release:
    name: Upload verified draft release
    needs: [preflight, verify-assets]
    if: github.event_name == 'push' || inputs.action == 'build-draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verified-assets
          path: release-assets

      - name: Create draft and upload verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "refusing to modify an existing release for $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --draft
          gh release upload "$RELEASE_TAG" release-assets/incin-*

      - name: Verify uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release-assets.py verify-github --tag "$RELEASE_TAG" --directory release-assets

  publish-release:
    name: Publish an existing verified draft release
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-existing-draft'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download draft assets for independent verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --pattern "incin-*"
          python3 tools/release-assets.py manifest --version "${{ needs.preflight.outputs.version }}" --directory release-assets

      - name: Reverify draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release-assets.py verify-github --tag "$RELEASE_TAG" --directory release-assets

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
