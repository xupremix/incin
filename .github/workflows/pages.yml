name: Deploy documentation

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/book/**"
      - "tools/check-docs.py"
      - "tools/check-book-site.py"
      - "tools/check-markdown-links.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

env:
  MDBOOK_VERSION: 0.4.52

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdBook
        run: cargo install mdbook --version "${MDBOOK_VERSION}" --locked
      - name: Install Chromium for browser checks
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Build and validate documentation
        run: |
          set -euo pipefail
          mdbook build docs/book
          python3 tools/check-docs.py
          python3 tools/check-markdown-links.py
          python3 docs/book/build_site.py
          python3 tools/check-book-site.py
          python3 tools/test-book-site.py
          node --check docs/book/site/book.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book/site

  deploy:
    name: Deploy documentation site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
