name: Kindle CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache Cargo modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libvulkan-dev mesa-vulkan-drivers

      
    - name: Check Formatting
      run: cargo fmt --all -- --check
      
    - name: Clippy Lints
      run: cargo clippy --workspace --all-targets --no-default-features --features kindle-backends/cpu,kindle/cpu -- -D warnings

    - name: Run Unit & Integration Tests
      run: cargo test --workspace --all-targets --no-default-features --features kindle-backends/cpu,kindle/cpu

    - name: Build Examples
      run: cargo build --examples --workspace --no-default-features --features kindle-backends/cpu,kindle/cpu
