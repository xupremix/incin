name: Incin CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.4.52
  PUBLIC_API_VERSION: 0.52.0

permissions:
  contents: read

jobs:
  test:
    name: CPU Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Cache Cargo modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # Components are named explicitly rather than left to the default profile.
    # Every run in this repository's visible history failed on the first
    # `cargo fmt`, because the action installed one toolchain and
    # rust-toolchain.toml selected another that had no rustfmt; the clippy gate
    # below had consequently never executed either. rust-toolchain.toml now
    # tracks stable and asks for both, and naming them here keeps the job
    # correct even if that file changes.
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libvulkan-dev mesa-vulkan-drivers

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Check Rust documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps

    - name: Check facade documentation coverage
      env:
        RUSTDOCFLAGS: -D warnings -D missing_docs
      run: cargo doc -p incin --lib --no-deps

    - name: Check reviewed public API
      run: |
        cargo install cargo-public-api --version "${PUBLIC_API_VERSION}" --locked
        bash tools/check-public-api.sh
        python3 tools/check-unsafe-ledger.py
        python3 tools/check-hidden-items.py

    # These three commands used to carry `--workspace --exclude backends
    # --exclude tui_graph_demo --exclude native_training_demo`, which is now
    # `default-members` in the root manifest instead. The exclusions were
    # blanket in the literal sense: repeating them on every command meant the
    # three example crates were linted and tested nowhere, and a fourth crate
    # with the same problem would have needed a fourth `--exclude` on each line.
    # The WGPU job below now runs `--workspace`, so those three are covered
    # there rather than merely built, and the CPU set is a manifest fact rather
    # than an argument list that has to be kept in sync across three commands.
    - name: Clippy Lints
      run: cargo clippy --all-targets --no-default-features --features incin-backends/cpu,incin/cpu -- -D warnings

    - name: Run Unit & Integration Tests
      run: cargo test --all-targets --no-default-features --features incin-backends/cpu,incin/cpu

    - name: Build Examples
      run: cargo build --examples --no-default-features --features incin-backends/cpu,incin/cpu

    # The workspace run above resolves features across every member, so a
    # backend crate that had come to depend on something another member turns
    # on would still pass it. These two build incin-backends alone, on the
    # bare feature set a CPU-only consumer actually gets, and then again with
    # the optional blocked GEMM so its parity tests run somewhere.
    # Appendix B ships a preview-tier row behind a non-default feature, so the
    # default run above executes none of them: `cargo test` on a `cfg`-gated
    # suite reports `ok` having run nothing. These are the evidence commands
    # for `UX-001` and the completed distributed rows verbatim.
    - name: Run Preview-Feature Tests
      run: |
        cargo test -p incin --features train --test trainer
        cargo test -p incin-core --features distributed --test mesh_compile
        cargo test -p incin-core --features distributed --test mesh_bind
        cargo test -p incin-core --features distributed --test placement_rules
        cargo test -p incin-core --features distributed --test placement_tensor
        cargo test -p incin-core --features distributed --test collective_plan
        cargo test -p incin-core --features distributed --test data_parallel
        cargo test -p incin-core --features distributed --test tensor_parallel
        cargo test -p incin-core --features distributed --test pipeline
        cargo test -p incin-core --features distributed --test hybrid_plan
        cargo test -p incin-backends --features distributed-reference --test reference_collectives
        cargo test -p incin-backends --features distributed-reference --test data_parallel_reference
        cargo test -p incin-backends --features distributed-reference --test tensor_parallel_reference
        cargo test -p incin-backends --features distributed-reference --test pipeline_reference
        cargo test -p incin-backends --features distributed-reference,autotune --test collective_tuning
        cargo test -p incin-backends --features autotune --test tuning_identity
        cargo test -p incin-backends --features autotune --test tuning_cache
        cargo test -p incin-backends --features autotune --test tuning_service
        cargo test -p incin-backends --features distributed-nccl --test nccl_contract
        cargo test -p incin --features distributed-nccl --test rendezvous
        cargo test -p incin --features distributed-nccl,hardware-tests --test dp2_network --no-run
        cargo test -p incin --features distributed-nccl,hardware-tests --test tp2_network --no-run
        cargo test -p incin --features distributed-nccl,hardware-tests --test pp2_network --no-run

    - name: Run Isolated Bare-CPU Tests
      run: cargo test -p incin-backends --no-default-features --features std,cpu

    - name: Run Bare-CPU Tests With The Optional Blocked GEMM
      run: cargo test -p incin-backends --no-default-features --features std,cpu,cpu-blas

  # Core, macros, and diagnostics have small enough feature spaces for useful
  # cargo-hack powersets. Backend and facade combinations are validated by the
  # explicit supported contract matrix in tools/feature-matrix.sh; exhaustive
  # backend and facade powersets are not a CI contract.
  powerset:
    name: Feature Powerset
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Cache Cargo modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-powerset-${{ hashFiles('**/Cargo.lock') }}

    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@cargo-hack

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libvulkan-dev mesa-vulkan-drivers

    # The claim the default feature set makes is that installing incin gets a
    # CPU build and nothing else. That claim is about the dependency graph, so
    # it is checked against the dependency graph: each of these crates enters
    # the tree only through a feature a user has to name, and any of them
    # appearing under the defaults means a forwarding rule leaked. Turning on
    # wgpu, cuda, external-candle, or cpu-blas each puts one of them back, so
    # this fails for the right reason rather than by never matching anything.
    - name: Assert the default install stays a bare CPU build
      run: |
        leaked=$(cargo tree -p incin --edges normal --prefix none | sort -u \
          | grep -iE '^(wgpu|cudarc|candle-core|candle-nn|matrixmultiply) ' || true)
        if [ -n "$leaked" ]; then
          echo "the default feature set pulled in optional backend dependencies:"
          echo "$leaked"
          exit 1
        fi
        echo "default features resolve without wgpu, cudarc, candle, or matrixmultiply"

    # `nightly` is excluded everywhere because it enables `#![feature]`, which
    # the stable channel rejects before any of this crate's own code is
    # reached. The external-candle feature is excluded from the broad matrix
    # because it pulls a large optional dependency graph; it has a focused
    # compile job elsewhere. Hardware tests are covered by hardware.yml.
    - name: incin-core, every feature combination
      run: cargo hack check -p incin-core --feature-powerset --all-targets --exclude-features nightly

    # `--no-dev-deps` rather than `--all-targets`: this crate's dev-dependency
    # is `incin` itself, so building its test targets rebuilds the facade under
    # every combination of a feature set the facade does not have.
    - name: incin-macros, every feature combination
      run: cargo hack check -p incin-macros --feature-powerset --no-dev-deps --exclude-features nightly

    - name: incin-diagnostics, every feature combination
      run: cargo hack check -p incin-diagnostics --feature-powerset --all-targets

  # Every job above proves the unsafe code compiles. None of them proves it is
  # sound, and roughly 170 `unsafe` sites sit behind the CPU backend's SIMD
  # kernels. Worse, most of those kernels are not merely unproven but
  # unexecuted: `simd_lanes()` is a `const fn` over `target_feature`, so on a
  # default x86_64 build every branch into the dense AVX2 path is const-false
  # and eliminated. The `+avx2` leg inside the script is the only thing in this
  # file that runs them at all.
  soundness:
    name: Miri and Sanitizers
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Cache Cargo modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-soundness-${{ hashFiles('**/Cargo.lock') }}

    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri, rust-src

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    # Split rather than run as `all` so a miri failure and a sanitizer failure
    # are distinguishable from the job log without opening it.
    - name: Miri
      run: tools/soundness.sh miri

    - name: AddressSanitizer and LeakSanitizer
      run: tools/soundness.sh asan

  ledger:
    name: Execution Ledger Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Validate PROPOSALS.md against docs/plan/ledger.toml
      run: cargo xtask ledger
    - name: Run xtask unit tests
      run: cargo test -p xtask
    - name: Enforce regression budgets and feature inventory
      run: cargo xtask budgets
    # UX-013. README.md's feature tables are generated from the Cargo
    # manifests; this fails when the checked-in text and the manifests
    # disagree. The capability tables have a different authority and are
    # checked by `incin-backends`' `generated_docs` suite instead.
    - name: Check README.md's generated feature tables
      run: cargo xtask docs --check
    - name: Run Supported Feature Contract Matrix
      run: cargo xtask feature-matrix
    - name: Enforce shape-proof audit budgets
      run: tools/audit-shapes.sh --check

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    # The WGPU dependencies are here for the all-backend build below, which
    # compiles wgpu in order to document what sits on top of it.
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libvulkan-dev mesa-vulkan-drivers
    - name: Build docs with warnings denied
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --no-default-features --features incin-backends/cpu,incin/cpu
    # The build above documents what a default install exposes, which leaves
    # every GPU and external-backend item undocumented by CI: an intra-doc link
    # into `incin_backends::cuda` resolves only when `cuda` is on, so a broken
    # one is invisible to a CPU-only doc build. This is the set docs.rs would
    # publish, minus `nightly`, which the stable channel rejects outright.
    - name: Build docs with every backend enabled
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc -p incin -p incin-backends -p incin-core --no-deps --no-default-features --features incin/cpu,incin/cuda,incin/wgpu,incin/telemetry,incin/external-candle
    # UX-013. `cargo test --all-targets` in the `test` job does NOT run
    # doctests; `--all-targets` excludes them, so until this step existed no
    # job compiled a single public example. That is how the workspace reached
    # seventy `ignore`-fenced examples with a green pipeline.
    # `incin-core/distributed` is named because a `cfg`-gated module's examples
    # are excluded from a default doc run for exactly the reason its tests are,
    # and "no public example is excluded from compilation" has to mean the
    # preview surface too.
    - name: Compile every public example
      run: cargo test --workspace --doc --features incin-core/distributed

  core-no-std:
    name: Core no_std Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    # incin-core resolves against the workspace, which pulls onnx-pb's prost
    # build script into the graph even for a core-only check. Every other job
    # that reaches a build script installs this; this one never did, and nothing
    # noticed because the job had not run since before the toolchain broke.
    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Check incin-core without default features
      run: cargo check -p incin-core --no-default-features

  wgpu:
    name: WGPU Software Adapter Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - name: Install WGPU system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libvulkan-dev mesa-vulkan-drivers
    - name: Run WGPU tests with CPU parity
      run: cargo test -p incin-backends --all-targets --no-default-features --features std,cpu,wgpu
    # `--workspace` rather than the three package names the CPU job used to
    # exclude. Those three are the only members that cannot build without WGPU,
    # so covering the whole workspace here is what lets the CPU job stop naming
    # them, and it means a member added later is linted by one job or the other
    # without anybody remembering to list it. This also lints the three example
    # crates, which the previous `cargo build` of them did not.
    - name: Lint the whole workspace with WGPU enabled
      run: cargo clippy --workspace --all-targets --no-default-features --features incin-backends/cpu,incin-backends/wgpu,incin/cpu,incin/wgpu -- -D warnings

  cuda-compile:
    name: CUDA Compile Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Compile CUDA backend without requiring a GPU
      run: cargo check -p incin-backends --all-targets --no-default-features --features std,cpu,cuda

  # Every other backend job above enables `cpu` alongside the backend it is
  # named for, so none of them can see an accelerator reaching into the CPU
  # backend for code. Three had: `contiguous_strides`, `broadcast_shape` and
  # `increment_index` were called 95 times from `cuda/`, `wgpu/` and `metal/`,
  # which `lib.rs` had absorbed by compiling the whole CPU module whenever CUDA
  # was on. `--features metal` alone did not compile at all, and nothing here
  # was in a position to say so. Those helpers now live in `crate::layout`.
  #
  # `cargo check` per backend rather than a feature Cartesian product:
  # `incin-backends` has many orthogonal opt-ins, so the supported contract
  # matrix names the combinations that matter. Metal is compile-checked here
  # rather than only on the macOS runner in hardware.yml because the feature
  # pulls in no platform-gated dependency, so a Linux runner type-checks it.
  backend-isolation:
    name: Each Backend Without The CPU Backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda, wgpu, metal]
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libvulkan-dev
    - name: Compile ${{ matrix.backend }} on its own
      run: cargo check -p incin-backends --no-default-features --features std,${{ matrix.backend }}

  book:
    name: Build the mdBook Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Install Chromium for browser checks
      run: sudo apt-get install -y chromium

    # Cached separately from the main workspace cache: mdbook is a standalone
    # binary the workspace itself never depends on, and sharing the `test`
    # job's cache key would tie this job's speed to workspace lockfile
    # changes that have nothing to do with it.
    - name: Cache mdbook binary
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/mdbook
        key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-${{ hashFiles('docs/book/book.toml') }}
        restore-keys: |
          ${{ runner.os }}-mdbook-

    - name: Install mdbook
      run: command -v mdbook && mdbook --version | grep -F "${MDBOOK_VERSION}" || cargo install mdbook --version "${MDBOOK_VERSION}" --locked

    - name: Build the book
      run: mdbook build docs/book

    - name: Build and validate the chaptered site
      run: |
        python3 tools/check-docs.py
        python3 tools/check-markdown-links.py
        python3 docs/book/build_site.py
        python3 tools/check-book-site.py
        python3 tools/test-book-site.py
        node --check docs/book/site/book.js

    # Rust examples need Cargo's dependency metadata; mdbook test invokes
    # standalone rustdoc and therefore cannot validate these facade imports.
    - name: Compile the Book examples
      run: cargo test -p incin --features backend-authoring --doc

    # A self-contained single HTML file with no external CSS/JS/font
    # requests - inlined from the multi-page build above, not a second
    # independent render, so it can never drift from it.
    - name: Build the single-page static version
      run: |
        python3 -m venv /tmp/incin-book-venv
        /tmp/incin-book-venv/bin/pip install --requirement docs/book/requirements.txt
        /tmp/incin-book-venv/bin/python docs/book/make_single_page.py

    # docs/book/book/ is generated output and is gitignored - it must never
    # be committed. This step makes that explicit rather than relying only
    # on the runner being torn down: autogen, then clean, every run.
    - name: Remove generated output
      run: rm -rf docs/book/book
