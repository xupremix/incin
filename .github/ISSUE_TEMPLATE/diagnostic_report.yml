name: "🔍 Shape Diagnostic / Inlay Hint Issue"
description: Report an unreadable typenum compiler error or an issue with incin-lsp / editor hints
title: "[Diag]: "
labels: ["diagnostics", "area:lsp", "area:diagnostics"]
body:
  - type: markdown
    attributes:
      value: |
        Incin translates raw typenum error expressions (`UInt<UInt<...>>`) into human-readable shape diagnostics.
  - type: dropdown
    id: tool
    attributes:
      label: Tool & Editor Environment
      options:
        - "cargo incin check / cargo incin build"
        - "incin-lsp (proxy binary)"
        - "VS Code Extension (incin-lsp-vscode)"
        - "Neovim (incin-lsp.lua)"
        - "RustRover / JetBrains"
        - "Other / Raw rustc"
    validations:
      required: true
  - type: textarea
    id: original-error
    attributes:
      label: Raw rustc Error Output
      description: The exact unreadable compiler message emitted by rustc or rust-analyzer.
      placeholder: |
        ```text
        error[E0277]: the trait bound `DimCons<UInt<...>, Nil>: MatMulShape<...>` is not satisfied
        ```
      render: text
    validations:
      required: true
  - type: textarea
    id: translated-output
    attributes:
      label: Translated Output (if any)
      description: What did `cargo incin check` or the editor currently show?
      placeholder: |
        ```text
        Cannot contract dimension UInt<...> with UInt<...>
        ```
      render: text
  - type: textarea
    id: expected-humanized
    attributes:
      label: Desired Humanized Error Message
      description: How should this error ideally be explained to a developer?
      placeholder: "Cannot matrix-multiply [4, 8] and [3, 8]: inner dimensions (8 and 3) do not match."
    validations:
      required: true
