[workspace]
resolver = "2"

members = [
	"crates/*",
	"examples/*",
]

exclude = []

[workspace.package]
edition = "2024"
version = "0.1.0"
readme = "README.md"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]

[workspace.dependencies]
proc-macro2 = { version = "1.0.103", default-features = false }
syn = { version = "2.0.111", features = ["full"] }
quote = { version = "1.0.42", default-features = false }
candle-core = { version = "0.9.1", default-features = false }
candle-nn = { version = "0.9.1", default-features = false }
thiserror = { version = "2.0.17", default-features = false }
half = { version = "2.7.1", default-features = false }
# miette = "7.6.0"
