[workspace]
resolver = "2"

members = [
    "crates/incin",
    "crates/incin-backends",
    "crates/incin-core",
    "crates/incin-diagnostics",
    "crates/incin-lsp",
    "crates/incin-data",
    "crates/incin-macros",
    "crates/incin-telemetry",
    "crates/incin-viz-plugin-api",
    "crates/incin-viz",
    "crates/incin/examples/*",
    "crates/incin-core/examples/*",
    "xtask"
]

# Everything above that a CPU-only build can compile. Three example crates ask
# for `incin/wgpu` in their own manifests, so a workspace-wide CPU build either
# fails on them or quietly turns WGPU on for every other member; CI used to name
# them on every command line as `--exclude`, which also meant they were never
# linted or tested anywhere. They are absent here and present in the WGPU job's
# `--workspace`, so the CPU gate does not have to name them and nothing added to
# the workspace later can escape both gates.
default-members = [
    "crates/incin",
    "crates/incin-backends",
    "crates/incin-core",
    "crates/incin-diagnostics",
    "crates/incin-lsp",
    "crates/incin-data",
    "crates/incin-macros",
    "crates/incin-telemetry",
    "crates/incin-viz-plugin-api",
    "crates/incin-viz",
    "crates/incin/examples/cnn",
    "crates/incin/examples/dataloader",
    "crates/incin/examples/matmul",
    "crates/incin/examples/named_dims_safety",
    "crates/incin/examples/named_tensors",
    "crates/incin/examples/tensors",
    "xtask"
]

exclude = []

[workspace.package]
edition = "2024"
version = "0.1.0-rc.2"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xupremix/incin"
homepage = "https://xupremix.github.io/incin/"
authors = ["xupremix <xupremix.me@gmail.com>"]
# The oldest toolchain the workspace has actually been built on, not a guess:
# `cargo +1.88.0 check --workspace --all-targets` passes and 1.87 is refused by
# the dependency graph. CI's `msrv` job is what keeps this honest.
rust-version = "1.88"

[workspace.lints.rust]
# Evaluating ShapeEq associated consts as statements triggers compile-time shape assertions.
path_statements = "allow"
# Every unsafe operation inside an unsafe function must remain visibly scoped.
# This prevents a future edit from silently inheriting the function's contract.
unsafe_op_in_unsafe_fn = "deny"
# Every public item carries a summary. The doctest bar per surface is set by
# D-108 in PROPOSALS.md Appendix C: examples required on user-facing API,
# optional on internal proof machinery.
missing_docs = "deny"

[workspace.lints.clippy]
# Public generic signatures keep primary trait bounds near parameters and capability bounds in where clauses.
multiple_bound_locations = "allow"
# The public error contract intentionally returns the structured framework
# error by value. Test and example targets also use that contract directly.
result_large_err = "allow"
# Unsafe blocks are reviewable only when their immediate invariant is recorded.
undocumented_unsafe_blocks = "deny"
# A public unsafe API must state the contract that callers have to uphold.
missing_safety_doc = "deny"
[workspace.dependencies]
proc-macro2 = { version = "1.0.106", default-features = false }
syn = { version = "2.0.118", features = ["full"] }
quote = { version = "1.0.46", default-features = false }
candle-core = { version = "0.9.1", default-features = false }
candle-nn = { version = "0.9.1", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
half = { version = "2.7.1", default-features = false, features = ["bytemuck"] }
bytemuck = { version = "1.25", default-features = false }
# The ONNX protobuf runtime. Pinned once here because `incin-core` and
# `incin-macros` both include the same generated module and must agree on it.
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
# miette = "7.6.0"
[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
